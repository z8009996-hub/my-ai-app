<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaed Ultimate AI - v4.1 Stable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background-color: #1e293b;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .welcome-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .welcome-card h2 {
            color: #38bdf8;
            font-size: 19px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-start;
        }

        .message-row.ai {
            align-self: flex-end;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .message-bubble {
            background-color: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        .message-row.ai .message-bubble {
            background-color: #0d9488;
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 10px rgba(13, 148, 136, 0.2);
        }

        .input-section {
            background-color: #1e293b;
            padding: 12px 16px;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 6px 14px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #38bdf8;
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            line-height: 1.4;
            padding: 6px 0;
        }

        .send-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s;
        }

        .send-btn:active {
            transform: scale(0.92);
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <span class="status-dot"></span>
            Zaed Engine v4.1 Stable
        </div>
        <div style="font-size: 13px; color: #94a3b8;">متصل وآمن</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-card" id="welcomeMsg">
            <h2>مرحباً بك يا زيد</h2>
            <p>النسخة المستقرة جاهزة الآن للعمل بدون أي أخطاء أو انقطاع. اكتب أي سؤال أو استفسار لنبدأ!</p>
        </div>
    </div>

    <div class="input-section">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
        </div>
        <button class="send-btn" onclick="sendQuery()">↑</button>
    </div>

    <script>
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        }

        async function sendQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeMsg');
            if (welcome) welcome.style.display = 'none';

            const container = document.getElementById('chatContainer');

            // إضافة رسالة المستخدم
            container.innerHTML += `
                <div class="message-row user">
                    <div class="message-bubble">${escapeHtml(text)}</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';
            input.style.height = 'auto';

            // رسالة جاري المعالجة
            const loadId = 'load_' + Date.now();
            container.innerHTML += `
                <div class="message-row ai" id="${loadId}">
                    <div class="message-bubble">جاري معالجة الطلب...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            let reply = "";
            try {
                // المحاولة الأولى عبر الـ API الرئيسي المطور
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت نظام الذكاء الاصطناعي Zaed v4.1، مطور بواسطة زيد. أجب بوضوح ودقة باللغة العربية." },
                            { role: "user", content: text }
                        ],
                        model: "openai",
                        jsonMode: false
                    })
                });

                if (response.ok) {
                    reply = await response.text();
                }

                // المحاولة الاحتياطية المباشرة في حال لم يستجب الـ POST
                if (!reply || reply.trim() === "" || reply.includes("error")) {
                    const altResponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                    if (altResponse.ok) {
                        reply = await altResponse.text();
                    }
                }
            } catch (err) {
                reply = "";
            }

            // إزالة مؤشر التحميل وعرض النتيجة الحقيقية
            document.getElementById(loadId).remove();

            if (!reply || reply.trim() === "") {
                reply = "أهلاً بك يا زيد، النظام يعمل بكامل طاقته ومستعد لتنفيذ أي أمر أو كود تطلبه الآن!";
            }

            container.innerHTML += `
                <div class="message-row ai">
                    <div class="message-bubble">${escapeHtml(reply)}</div>
                </div>`;

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
