<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zide Lite - 200MB</title>
<style>
*{box-sizing:border-box}:root{--bg:#070a11;--border:rgba(255,255,255,.09);--text:#fff;--muted:#8792a8;--p:#6577ff;--pu:#ad55ff}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
header{position:fixed;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:rgba(7,10,17,.9);border-bottom:1px solid var(--border);z-index:10}
.chat{width:min(850px,calc(100% - 16px));margin:auto;padding:80px 0 130px}
.message{display:flex;gap:10px;margin:20px 0}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#293349;font-weight:bold}.ai.avatar{background:linear-gradient(135deg,var(--p),var(--pu))}
.bubble{line-height:1.8;white-space:pre-wrap}
.composerWrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 14px))}
.composer{display:flex;gap:6px;padding:7px;border-radius:18px;background:#101624;border:1px solid var(--border)}
textarea{flex:1;background:transparent;border:0;color:#fff;outline:0;resize:none;padding:12px}
.send{width:44px;height:44px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--pu));color:#fff}
</style>
</head>
<body>
<header><div style="font-weight:900">Zide Ultra • 200MB</div><div id="status" style="font-size:11px;color:#62e69a">● أونلاين • خفيف للتلفون</div></header>
<main class="chat" id="chat"></main>
<div class="composerWrap"><form id="form" class="composer"><textarea id="input" placeholder="بحمل العقل 200MB..."></textarea><button class="send" id="btn" disabled>↑</button></form></div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.79";
const chat=document.getElementById("chat"), input=document.getElementById("input"), btn=document.getElementById("btn"), statusEl=document.getElementById("status");
let engine;

// هذا النموذج حجمه 200 ميجا فقط - ممتاز للتلفون
const MODEL = "SmolLM2-360M-Instruct-q4f32_1-MLC"; // حوالي 200MB

async function load(){
 engine = await CreateMLCEngine(MODEL, {
  initProgressCallback:(p)=>{
   input.placeholder = p.text + " " + Math.round(p.progress*100)+"%";
   if(p.progress>=1){
    input.placeholder="احكي مع Zide...";
    btn.disabled=false;
    statusEl.textContent="● جاهز • 200MB • أونلاين";
   }
  }
 });
}
load();

document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();
 let t=input.value.trim(); if(!t||!engine) return;
 add(t,"user"); input.value="";
 let box=add("","ai");
 let full="";
 let msgs=[{role:"system",content:"أنت Zide Ultra، مساعد عربي ذكي خفيف. جاوب بالعربية باختصار."},{role:"user",content:t}];
 let res=await engine.chat.completions.create({messages:msgs,stream:true});
 for await(const c of res){ full+=c.choices[0].delta.content||""; box.textContent=full; window.scrollTo(0,99999); }
};
function add(t,r){let d=document.createElement("div");d.className="message";d.innerHTML=`<div class="avatar ${r=="ai"?"ai":""}">${r=="ai"?"Z":"أنت"}</div><div class="bubble">${t}</div>`;chat.appendChild(d);return d.querySelector(".bubble");}
</script>
</body>
</html>
