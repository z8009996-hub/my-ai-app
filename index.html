<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zide Ultra - Real 1.5B</title>
<style>
*{box-sizing:border-box}:root{--bg:#070a11;--border:rgba(255,255,255,.09);--text:#fff;--muted:#8792a8;--p:#6577ff;--pu:#ad55ff}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
header{position:fixed;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:rgba(7,10,17,.95);border-bottom:1px solid var(--border);z-index:10}
.logo{display:flex;gap:8px;align-items:center;font-weight:900}
.logoBox{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--pu));display:grid;place-items:center}
.chat{width:min(850px,calc(100% - 16px));margin:auto;padding:90px 0 140px}
.welcome{text-align:center;padding-top:5vh}
.barWrap{width:100%;max-width:500px;margin:20px auto;background:rgba(255,255,255,.08);height:6px;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0%;background:linear-gradient(90deg,var(--p),var(--pu));transition:width.3s}
.message{display:flex;gap:10px;margin:22px 0}.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#293349;font-weight:bold}.ai.avatar{background:linear-gradient(135deg,var(--p),var(--pu))}
.bubble{line-height:1.9;white-space:pre-wrap;word-break:break-word}
.user.bubble{background:rgba(255,255,255,.06);padding:12px 16px;border-radius:16px;border:1px solid var(--border)}
pre{direction:ltr;text-align:left;background:#05070c;border:1px solid var(--border);padding:12px;border-radius:12px;overflow:auto;white-space:pre-wrap}
.composerWrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(850px,calc(100% - 14px))}
.composer{display:flex;gap:6px;padding:7px;border-radius:18px;background:#101624;border:1px solid var(--border)}
textarea{flex:1;background:transparent;border:0;color:#fff;outline:0;resize:none;padding:12px;min-height:46px}
.send{width:44px;height:44px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--pu));color:#fff;font-size:20px}
</style>
</head>
<body>
<header><div class="logo"><div class="logoBox">Z</div>Zide Ultra • 1.5B</div><div id="status" style="font-size:11px;color:#62e69a">● ثقيل وحقيقي</div></header>
<main class="chat" id="chat">
<section id="welcome" class="welcome">
<h1>النسخة الثقيلة جاهزة</h1>
<p id="loadText" style="color:var(--muted)">جاري تحميل العقل الحقيقي 1.2 جيجا أول مرة...</p>
<div class="barWrap"><div id="bar"></div></div>
<p style="color:var(--muted);font-size:12px">أول مرة بتأخذ 2-3 دقايق على الواي فاي، بعدها سريع</p>
</section>
</main>
<div class="composerWrap"><form id="form" class="composer"><textarea id="input" placeholder="جاري التحميل..." disabled></textarea><button class="send" id="btn" disabled>↑</button></form></div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.79";
const chat=document.getElementById("chat"), input=document.getElementById("input"), btn=document.getElementById("btn"), bar=document.getElementById("bar"), loadText=document.getElementById("loadText"), welcome=document.getElementById("welcome");
let engine;

// === النسخة الثقيلة الحقيقية - 1.5B أفضل عربي ===
const MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"; // حوالي 1.1 جيجا - ذكي جداً للعربي

async function init(){
 engine = await CreateMLCEngine(MODEL, {
  initProgressCallback:(p)=>{
   bar.style.width = Math.round(p.progress*100)+"%";
   loadText.textContent = p.text + " - " + Math.round(p.progress*100)+"%";
   if(p.progress>=1){
    loadText.textContent="✅ جاهز! هذا ذكاء حقيقي مش تهبيل";
    input.placeholder="اكتب أي شي... كود، موقع، شرح";
    input.disabled=false; btn.disabled=false;
    welcome.style.display="none";
    add("أهلا! أنا Zide Ultra النسخة الثقيلة 1.5B\n\nجربني: اطلب 'موقع ذكاء اصطناعي' أو 'كود فحص الشبكة' ورح أبنيه لك كامل بدون تهبيل.","ai");
   }
  }
 });
}
init();

document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();
 let t=input.value.trim(); if(!t||!engine) return;
 add(t,"user"); input.value="";
 let box=add("","ai"); let full="";
 let msgs=[
  {role:"system", content:"أنت Zide Ultra، مساعد ذكاء اصطناعي عربي قوي. اسمك Zide. تجاوب بالعربية العامية الأردنية/فلسطينية بشكل ذكي ومفيد. إذا طلب كود أعط كود كامل شغال. لا تقل أنك Qwen."},
  {role:"user", content:t}
 ];
 try{
  let stream=await engine.chat.completions.create({messages:msgs, stream:true, temperature:0.7, max_tokens:1000});
  for await(const c of stream){
   let d=c.choices[0]?.delta?.content||"";
   full+=d;
   box.innerHTML=format(full);
   window.scrollTo(0,document.body.scrollHeight);
  }
 }catch(err){box.textContent="خطأ: "+err.message}
};

function add(t,role){
 let d=document.createElement("div"); d.className="message";
 d.innerHTML=`<div class="avatar ${role=="ai"?"ai":""}">${role=="ai"?"Z":"أنت"}</div><div class="bubble">${format(t)}</div>`;
 chat.appendChild(d); window.scrollTo(0,99999);
 return d.querySelector(".bubble");
}
function format(t){
 let x=t.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
 x=x.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
 return x.replace(/\n/g,"<br>");
}
</script>
</body>
</html>
