<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zaed Ultimate AI</title>
    
    <!-- مكتبة جوجل الرسمية للاعتماد -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- خط تجوال السريع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(19, 26, 42, 0.75);
            --accent-glow: #6366f1;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        /* قفل أبعاد الصفحة بالكامل لتناسب حواف الشاشة دون أي تمرير إضافي */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            contain: strict;
        }

        /* ==================== 1. شاشة تسجيل الدخول ==================== */
        #login-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #090d16 100%);
            z-index: 50;
            will-change: opacity, transform;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #login-screen.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: translateZ(0);
        }

        .login-card h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            min-height: 44px;
        }

        /* ==================== 2. شاشة المحادثة (الذكاء الاصطناعي) ==================== */
        #chat-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-primary);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #chat-screen.active {
            visibility: visible;
            opacity: 1;
        }

        /* الهيدر العلوي */
        .chat-header {
            height: 64px;
            padding: 0 18px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent-glow);
            object-fit: cover;
        }

        .user-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .user-info span {
            font-size: 0.75rem;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:active {
            background: rgba(239, 68, 68, 0.25);
        }

        /* صندوق الرسائل السريع */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* فقاعات المحادثة */
        .msg {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.55;
            word-break: break-word;
            contain: content;
            animation: fadeIn 0.15s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .msg.ai {
            align-self: flex-end;
            background: #131a2a;
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        /* مؤشر الكتابة السريع */
        .typing-indicator {
            display: none;
            align-self: flex-end;
            background: #131a2a;
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            gap: 5px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #a5b4fc;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* شريط إدخال النص السريع في الأسفل */
        .chat-input-wrapper {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #1a2336;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent-glow);
        }

        .send-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- 1️⃣ شاشة الدخول -->
    <div id="login-screen">
        <div class="login-card">
            <h1>Zaed Ultimate AI</h1>
            <p>سجل دخولك الآن للوصول إلى محرك الذكاء الاصطناعي الخاص بـ Zaed</p>

            <div id="g_id_onload"
                 data-client_id="345485685718-oa9q1o5dko39gjkd6fg4foo8rgl7jigu.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="google-btn-container">
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="filled_blue"
                     data-text="sign_in_with"
                     data-shape="pill"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <!-- 2️⃣ شاشة الذكاء الاصطناعي -->
    <div id="chat-screen">
        <header class="chat-header">
            <div class="user-profile">
                <img id="user-avatar" class="user-avatar" src="" alt="User">
                <div class="user-info">
                    <h3 id="user-name">المستخدم</h3>
                    <span>● محرك Zaed النشط</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </header>

        <div id="chat-messages" class="chat-messages">
            <div class="msg ai">
                أهلاً بك! أنا Zaed Ultimate AI. كيف يمكنني مساعدتك اليوم؟ 🚀
            </div>
        </div>

        <div id="typing-indicator" class="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-wrapper">
            <input type="text" id="user-input" class="chat-input" placeholder="اكتب سؤالك هنا..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // رابط Discord Webhook لمتابعة الزوار بدقة وخلفية غير حاصرة (Non-blocking)
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1289290002157113404/YOUR_WEBHOOK_DETAILS_HERE";

        const elements = {
            loginScreen: document.getElementById('login-screen'),
            chatScreen: document.getElementById('chat-screen'),
            userName: document.getElementById('user-name'),
            userAvatar: document.getElementById('user-avatar'),
            messages: document.getElementById('chat-messages'),
            input: document.getElementById('user-input'),
            typing: document.getElementById('typing-indicator')
        };

        // التحقق السريع من الجلسة المحفوظة فور التحميل
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('zaed_ai_session');
            if (savedUser) {
                try {
                    initChat(JSON.parse(savedUser));
                } catch (e) {
                    localStorage.removeItem('zaed_ai_session');
                }
            }

            elements.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });

        // معالجة استجابة تسجيل دخول جوجل
        function handleCredentialResponse(response) {
            const user = parseJwt(response.credential);
            localStorage.setItem('zaed_ai_session', JSON.stringify(user));
            
            // إرسال إشعار الديسكورد عبر الخلفية بدون تعطيل واجهة المستخدم
            dispatchDiscordNotification(user);
            
            initChat(user);
        }

        // فك تشفير JWT بشكل برمي سريع
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => 
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // إظهار الشاشة وتجهيز البيانات
        function initChat(user) {
            elements.userName.textContent = user.name || "مستخدم Zaed";
            elements.userAvatar.src = user.picture || "https://lh3.googleusercontent.com/a/default-user";
            
            elements.loginScreen.classList.add('hidden');
            elements.chatScreen.classList.add('active');
            setTimeout(() => elements.input.focus(), 300);
        }

        function logout() {
            localStorage.removeItem('zaed_ai_session');
            location.reload();
        }

        // محرك الاستجابة وإرسال الرسائل السريع جداً
        function sendMessage() {
            const text = elements.input.value.trim();
            if (!text) return;

            // إدراج رسالة المستخدم فوراً لتجربة سلسة
            appendMessage(text, 'user');
            elements.input.value = '';

            // إظهار مؤشر الكتابة
            showTyping(true);

            // محاكاة استجابة المحرك بسرعة فائقة (أو ربط المباشر مع API الخاص بك)
            setTimeout(() => {
                showTyping(false);
                processAiResponse(text);
            }, 300 + Math.random() * 200); // زمن استجابة سريع للغاية (300ms)
        }

        function processAiResponse(prompt) {
            // هنا يتم صياغة الرد المباشر من محرك Zaed السريع
            let responseText = "أنا جاهز تماماً لمعالجة أليمة لأي استفساراتك بأقصى سرعة!";
            
            if (prompt.includes("من انت") || prompt.includes("مين انت") || prompt.includes("من طورك")) {
                responseText = "أنا Zaed Ultimate AI، تم تطويري وبرمجتي بالكامل بواسطة **زيد** لتقديم أسرع وأذكى استجابة ممكنة.";
            }

            appendMessage(responseText, 'ai');
        }

        // إضافة العناصر للـ DOM باستخدام أسرع طريقة بناء متوافقة مع المتصفحات
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.textContent = text;
            
            elements.messages.appendChild(msgDiv);
            
            // التمرير الفوري لأسفل
            requestAnimationFrame(() => {
                elements.messages.scrollTop = elements.messages.scrollHeight;
            });
        }

        function showTyping(state) {
            elements.typing.style.display = state ? 'flex' : 'none';
            if (state) {
                elements.messages.scrollTop = elements.messages.scrollHeight;
            }
        }

        // إرسال تنبيه الديسكورد عبر غير الحاصر (keepalive fetch)
        function dispatchDiscordNotification(user) {
            if (!DISCORD_WEBHOOK_URL || !DISCORD_WEBHOOK_URL.startsWith("http")) return;

            const payload = {
                embeds: [{
                    title: "🚀 تسجيل دخول جديد في Zaed AI",
                    color: 65280,
                    fields: [
                        { name: "الاسم", value: user.name || "غير محدد", inline: true },
                        { name: "البريد", value: user.email || "غير محدد", inline: true }
                    ],
                    thumbnail: { url: user.picture },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                keepalive: true
            }).catch(() => {});
        }
    </script>
</body>
</html>
