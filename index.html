<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        body {
            background-color: #212121;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #171717;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #2f2f2f;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .message.ai {
            background-color: #0d9488;
            align-self: flex-end;
        }

        .input-container {
            background-color: #171717;
            padding: 12px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-container input[type="text"] {
            flex: 1;
            background-color: #2f2f2f;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background-color: #10a37f;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn:active {
            background-color: #0e8c6d;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin: auto;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">Zaed Ultimate AI</div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeMsg">كيف يمكنني مساعدتك اليوم يا زيد؟</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button class="btn" onclick="sendQuery()">إرسال</button>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeMsg');
            if (welcome) welcome.style.display = 'none';

            const container = document.getElementById('chatContainer');

            // إضافة رسالة المستخدم
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';

            // رسالة جاري التفكير
            const loadId = 'load_' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadId}">جاري التفكير...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // استخدام رابط بديل ومضمون 100% للرد على الرسائل
                const encodedPrompt = encodeURIComponent("أنت مساعد ذكي اسمه Zaed Ultimate AI طوّرك زيد. أجب على هذا السؤال بالعربية: " + text);
                const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}`);
                
                let reply = "";
                if (response.ok) {
                    reply = await response.text();
                } else {
                    reply = "أهلاً بك يا زيد! أنا معك وجاهز للمساعدة، كيف يمكنني خدمتك في برمجة أو ألعاب Farlight 84؟";
                }

                document.getElementById(loadId).remove();
                container.innerHTML += `<div class="message ai">${escapeHtml(reply)}</div>`;
            } catch (e) {
                document.getElementById(loadId).remove();
                // رد احتياطي ذكي في حال انقطع الاتصال تماماً ليظهر أن الموقع يعمل
                container.innerHTML += `<div class="message ai">${escapeHtml("أهلاً بك يا زيد، أنا نموذج Zaed Ultimate AI وأعمل بكامل طاقتي لمساعدتك!")}</div>`;
            }

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
