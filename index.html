<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        .header {
            background-color: #141923;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222938;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background-color: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .status-info h2 {
            font-size: 16px;
            color: #fff;
        }

        .status-info p {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.ai {
            background-color: #1a202c;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid #2d3748;
        }

        .message.user {
            background-color: #6366f1;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            display: block;
        }

        .message.loading {
            background-color: #1a202c;
            color: #a0aec0;
            align-self: flex-start;
            font-style: italic;
        }

        .image-preview-bar {
            display: none;
            padding: 10px 20px;
            background-color: #181f2c;
            border-top: 1px solid #222938;
            align-items: center;
            gap: 10px;
        }

        .image-preview-bar img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #6366f1;
        }

        .image-preview-bar .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .input-container {
            padding: 15px 20px;
            background-color: #141923;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #222938;
        }

        .input-container input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-container input[type="text"]:focus {
            border-color: #6366f1;
        }

        .icon-btn {
            background-color: #2d3748;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #3b475d;
        }

        .send-btn {
            padding: 12px 20px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar">Z</div>
        <div class="status-info">
            <h2>Zaed Ultimate AI</h2>
            <p><span class="status-dot"></span> النظام متصل وجاهز</p>
        </div>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message ai">مرحباً بك! أنا Zaed Ultimate AI. جاهز لإجابة أسئلتك، تحليل الصور المرفقة أو الملتقطة، ورسم الأفكار 🚀</div>
    </div>

    <div class="image-preview-bar" id="preview-bar">
        <img id="preview-img" src="" alt="المعاينة">
        <span style="font-size: 13px; color: #a0aec0;">صورة جاهزة للتحليل...</span>
        <button class="remove-btn" onclick="clearSelectedImage()">✕</button>
    </div>

    <div class="input-container">
        <!-- مدخل الكاميرا المباشرة -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleImageSelect(event)">
        
        <!-- مدخل اختيار ملف صورة من المعرض -->
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

        <button class="icon-btn" title="التقاط صورة بالكاميرا" onclick="document.getElementById('camera-input').click()">📷</button>
        <button class="icon-btn" title="اختيار صورة من المعرض" onclick="document.getElementById('file-input').click()">📁</button>

        <input type="text" id="user-input" placeholder="اسألني أي شيء أو اطلب 'ارسم صورة'..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        let selectedBase64Image = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64Image = e.target.result;
                    document.getElementById('preview-img').src = selectedBase64Image;
                    document.getElementById('preview-bar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearSelectedImage() {
            selectedBase64Image = null;
            document.getElementById('camera-input').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('preview-bar').style.display = 'none';
        }

        async function askAI(promptText, base64Image) {
            try {
                const systemPrompt = "أنت نموذج ذكاء اصطناعي حصري اسمه Zaed Ultimate AI، تم تطويرك وبرمجتك بالكامل بواسطة المطور زيد. أجب دائماً باللغة العربية بأسلوب ذكي وسريع ومفيد وقدم تحليلاً دقيقاً وشاملاً للصور وللنصوص. لا تذكر أي نماذج أو شركات أخرى أبداً.";

                if (base64Image) {
                    const userInstruction = promptText || "اشرح بالتفصيل الدقيق كل ما يوجد في هذه الصورة باللغة العربية واذكر جميع التفاصيل والعناصر الظاهرة فيها.";
                    
                    const response = await fetch("https://text.pollinations.ai/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: [
                                { role: "system", content: systemPrompt },
                                {
                                    role: "user",
                                    content: [
                                        { type: "text", text: userInstruction },
                                        { type: "image_url", image_url: { url: base64Image } }
                                    ]
                                }
                            ],
                            model: "openai"
                        })
                    });

                    if (response.ok) {
                        const resultText = await response.text();
                        if (resultText && resultText.trim().length > 0) return resultText.trim();
                    }
                } else {
                    const apiUrl = `https://text.pollinations.ai/${encodeURIComponent(promptText)}?system=${encodeURIComponent(systemPrompt)}`;
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const resultText = await response.text();
                        if (resultText && resultText.trim().length > 0) return resultText.trim();
                    }
                }
            } catch (e) {
                console.error("AI Error:", e);
            }

            return "عذراً، تعذر معالجة الطلب في الوقت الحالي. يرجى المحاولة مرة أخرى.";
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text && !selectedBase64Image) return;

            const userMsg = document.createElement("div");
            userMsg.className = "message user";

            const currentImage = selectedBase64Image;

            if (currentImage) {
                const img = document.createElement("img");
                img.src = currentImage;
                userMsg.appendChild(img);
            }

            if (text) {
                const textSpan = document.createElement("div");
                textSpan.textContent = text;
                userMsg.appendChild(textSpan);
            }

            chatBox.appendChild(userMsg);
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            clearSelectedImage();

            const loadingMsg = document.createElement("div");
            loadingMsg.className = "message loading";
            loadingMsg.textContent = currentImage ? "جاري فحص وتحليل الصورة..." : "جاري التفكير والتطبيق...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            let replyText = "";
            let generatedImgUrl = null;

            const lowerText = text.toLowerCase();
            const isImageGen = !currentImage && (lowerText.startsWith("ارسم") || lowerText.includes("صورة ل") || lowerText.includes("توليد صورة"));

            if (isImageGen) {
                loadingMsg.textContent = "جاري رسم الصورة... 🎨";
                let cleanPrompt = text.replace(/ارسم|توليد صورة|صورة لـ|صورة/g, "").trim() || text;
                generatedImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
                replyText = `تم رسم الصورة بواسطة Zaed Ultimate AI بناءً على طلبك: "${cleanPrompt}" 🎨`;
            } else {
                replyText = await askAI(text, currentImage);
            }

            chatBox.removeChild(loadingMsg);

            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            
            const txtDiv = document.createElement("div");
            txtDiv.textContent = replyText;
            aiMsg.appendChild(txtDiv);

            if (generatedImgUrl) {
                const aiImg = document.createElement("img");
                aiImg.src = generatedImgUrl;
                aiMsg.appendChild(aiImg);
            }

            chatBox.appendChild(aiMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
