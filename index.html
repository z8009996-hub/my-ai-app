<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a11">

<title>Zide AI</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#070a11;
 --panel:#101624;
 --border:rgba(255,255,255,.09);
 --text:#f5f7ff;
 --muted:#8792a8;
 --primary:#6577ff;
 --purple:#ad55ff;
 --green:#62e69a;
 --red:#ff5870;
}

html,body{
 margin:0;
 min-height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,system-ui,sans-serif;
}

body{
 background:
 radial-gradient(circle at 15% 0%,rgba(101,119,255,.2),transparent 32%),
 radial-gradient(circle at 90% 15%,rgba(173,85,255,.17),transparent 30%),
 var(--bg);
}

button,textarea{
 font:inherit;
}

header{
 height:64px;
 position:fixed;
 inset:0 0 auto 0;
 z-index:20;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 18px;
 background:rgba(7,10,17,.82);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:22px;
 font-weight:900;
}

.logoBox{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:linear-gradient(135deg,var(--primary),var(--purple));
}

.status{
 display:flex;
 align-items:center;
 gap:7px;
 color:var(--muted);
 font-size:11px;
}

.dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#f0b936;
 box-shadow:0 0 10px #f0b936;
}

.dot.ready{
 background:var(--green);
 box-shadow:0 0 12px var(--green);
}

.dot.error{
 background:var(--red);
 box-shadow:0 0 12px var(--red);
}

.chat{
 width:min(850px,calc(100% - 20px));
 margin:auto;
 padding:100px 0 155px;
}

.welcome{
 text-align:center;
 padding-top:9vh;
}

.welcomeLogo{
 width:82px;
 height:82px;
 margin:auto auto 20px;
 display:grid;
 place-items:center;
 border-radius:25px;
 background:linear-gradient(135deg,var(--primary),var(--purple));
 font-size:36px;
 font-weight:900;
 box-shadow:0 20px 60px rgba(101,119,255,.3);
}

h1{
 margin:0;
 font-size:clamp(38px,8vw,60px);
 letter-spacing:-3px;
}

.welcome p{
 color:var(--muted);
}

.cards{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 max-width:650px;
 margin:35px auto;
}

.card{
 padding:17px;
 border:1px solid var(--border);
 border-radius:15px;
 color:#b0b9ca;
 background:rgba(255,255,255,.035);
 text-align:right;
 cursor:pointer;
 transition:.2s;
}

.card:hover{
 background:rgba(101,119,255,.08);
 border-color:rgba(101,119,255,.5);
}

.message{
 display:flex;
 gap:10px;
 margin:28px 0;
}

.avatar{
 width:36px;
 height:36px;
 flex:0 0 36px;
 display:grid;
 place-items:center;
 border-radius:11px;
 font-size:11px;
 font-weight:bold;
}

.user .avatar{
 background:#293349;
}

.ai .avatar{
 background:linear-gradient(135deg,var(--primary),var(--purple));
}

.content{
 flex:1;
 min-width:0;
}

.name{
 color:#8d98ad;
 font-size:11px;
 margin-bottom:7px;
}

.bubble{
 font-size:15px;
 line-height:1.9;
 overflow-wrap:anywhere;
}

.user .bubble{
 display:inline-block;
 max-width:92%;
 padding:13px 16px;
 border-radius:17px;
 background:rgba(255,255,255,.055);
 border:1px solid var(--border);
}

.bubble img{
 display:block;
 max-width:100%;
 max-height:400px;
 margin-bottom:10px;
 border-radius:14px;
}

pre{
 direction:ltr;
 text-align:left;
 overflow:auto;
 padding:16px;
 border-radius:13px;
 background:#05070c;
 border:1px solid var(--border);
 white-space:pre-wrap;
}

code{
 font-family:Consolas,monospace;
}

.typing{
 display:flex;
 gap:5px;
 align-items:center;
 color:var(--muted);
}

.typing i{
 width:5px;
 height:5px;
 border-radius:50%;
 background:#8d98ad;
 animation:bounce 1s infinite;
}

.typing i:nth-child(2){
 animation-delay:.15s;
}

.typing i:nth-child(3){
 animation-delay:.3s;
}

@keyframes bounce{
 0%,80%,100%{
  opacity:.25;
  transform:translateY(0);
 }

 40%{
  opacity:1;
  transform:translateY(-4px);
 }
}

.preview{
 display:none;
 gap:8px;
 overflow:auto;
 padding:8px;
 margin-bottom:8px;
 border-radius:14px;
 background:#121927;
 border:1px solid var(--border);
}

.previewItem{
 position:relative;
 flex:0 0 auto;
}

.previewItem img{
 width:70px;
 height:70px;
 object-fit:cover;
 border-radius:10px;
}

.remove{
 position:absolute;
 top:-5px;
 left:-5px;
 width:21px;
 height:21px;
 border:0;
 border-radius:50%;
 color:white;
 background:var(--red);
}

.composerWrap{
 position:fixed;
 left:50%;
 bottom:12px;
 transform:translateX(-50%);
 width:min(850px,calc(100% - 16px));
 z-index:30;
}

.composer{
 display:flex;
 align-items:flex-end;
 gap:7px;
 padding:8px;
 border-radius:20px;
 background:rgba(15,20,31,.95);
 border:1px solid rgba(255,255,255,.12);
 box-shadow:0 20px 70px rgba(0,0,0,.55);
 backdrop-filter:blur(25px);
}

textarea{
 flex:1;
 min-width:0;
 min-height:46px;
 max-height:170px;
 resize:none;
 outline:none;
 border:0;
 background:transparent;
 color:white;
 padding:13px;
}

textarea::placeholder{
 color:#657087;
}

.tool,.send,.stop{
 width:45px;
 height:45px;
 flex:0 0 45px;
 border:0;
 border-radius:13px;
 cursor:pointer;
}

.tool{
 color:white;
 background:#20283a;
}

.send{
 color:white;
 font-size:20px;
 background:linear-gradient(135deg,var(--primary),var(--purple));
}

.stop{
 display:none;
 color:white;
 background:#dc5268;
}

.loader{
 position:fixed;
 right:15px;
 bottom:90px;
 z-index:25;
 width:min(330px,calc(100% - 30px));
 padding:15px;
 border-radius:15px;
 background:rgba(16,22,36,.95);
 border:1px solid var(--border);
 box-shadow:0 15px 50px rgba(0,0,0,.4);
 backdrop-filter:blur(20px);
}

.loaderTitle{
 font-size:13px;
 font-weight:bold;
}

.loaderText{
 margin-top:5px;
 color:var(--muted);
 font-size:11px;
 line-height:1.6;
}

.progress{
 height:4px;
 margin-top:10px;
 overflow:hidden;
 border-radius:10px;
 background:#20283a;
}

.progressBar{
 width:30%;
 height:100%;
 background:linear-gradient(90deg,var(--primary),var(--purple));
 animation:loading 1.2s infinite;
}

@keyframes loading{
 from{
  transform:translateX(-150%);
 }

 to{
  transform:translateX(400%);
 }
}

.hidden{
 display:none!important;
}

@media(max-width:650px){

 .cards{
  grid-template-columns:1fr;
 }

 .welcome{
  padding-top:6vh;
 }

 .loader{
  bottom:85px;
 }

}
</style>
</head>

<body>

<header>

 <div class="logo">
  <div class="logoBox">Z</div>
  Zide
 </div>

 <div class="status">
  <span class="dot" id="dot"></span>
  <span id="status">جاري تجهيز AI...</span>
 </div>

</header>


<div class="loader" id="loader">

 <div class="loaderTitle">
  🧠 Zide Local AI
 </div>

 <div class="loaderText" id="loaderText">
  الموقع جاهز. يتم تجهيز الذكاء في الخلفية...
 </div>

 <div class="progress">
  <div class="progressBar"></div>
 </div>

</div>


<main class="chat" id="chat">

 <section class="welcome" id="welcome">

  <div class="welcomeLogo">
   Z
  </div>

  <h1>
   كيف أساعدك؟
  </h1>

  <p>
   ذكاء اصطناعي محلي بدون API
  </p>

  <div class="cards">

   <button
    class="card"
    data-text="اشرح لي هذا الموضوع بطريقة بسيطة وعميقة مع أمثلة.">
    🧠 اشرح لي موضوعًا
   </button>

   <button
    class="card"
    data-text="ساعدني في كتابة كود احترافي واشرح لي الحل.">
    💻 ساعدني بالبرمجة
   </button>

   <button
    class="card"
    data-text="ساعدني في تحليل هذه المشكلة خطوة بخطوة.">
    🚀 حل مشكلة
   </button>

   <button
    class="card"
    data-text="أريد مساعدتك في بناء مشروع برمجي كامل.">
    🛠️ بناء مشروع
   </button>

  </div>

 </section>

</main>


<div class="composerWrap">

 <div class="preview" id="preview"></div>

 <form class="composer" id="composer">

  <input
   id="files"
   type="file"
   accept="image/*"
   multiple
   hidden
  >

  <button
   class="tool"
   type="button"
   id="attach">
   📎
  </button>

  <textarea
   id="input"
   rows="1"
   placeholder="اكتب رسالتك إلى Zide...">
  </textarea>

  <button
   class="stop"
   type="button"
   id="stop">
   ■
  </button>

  <button
   class="send"
   type="submit"
   id="send">
   ↑
  </button>

 </form>

</div>


<script type="module">

/*
=====================================================
 ZIDE LOCAL
=====================================================

 لا API
 لا API KEY
 لا Backend

 النموذج يعمل على الجهاز باستخدام WebGPU.

=====================================================
*/


import {
 pipeline
} from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


/* =========================================
   النموذج
========================================= */

const MODEL =
"onnx-community/Qwen2.5-1.5B-Instruct-ONNX";


/* =========================================
   العناصر
========================================= */

const chat =
document.getElementById("chat");

const welcome =
document.getElementById("welcome");

const input =
document.getElementById("input");

const composer =
document.getElementById("composer");

const files =
document.getElementById("files");

const attach =
document.getElementById("attach");

const preview =
document.getElementById("preview");

const send =
document.getElementById("send");

const stop =
document.getElementById("stop");

const loader =
document.getElementById("loader");

const loaderText =
document.getElementById("loaderText");

const dot =
document.getElementById("dot");

const status =
document.getElementById("status");


/* =========================================
   حالة Zide
========================================= */

let ai = null;

let running = false;

let controller = null;

let images = [];

let history = [];

const MAX_HISTORY = 18;


/* =========================================
   شخصية Zide
========================================= */

const SYSTEM = `
أنت Zide، مساعد ذكاء اصطناعي متقدم.

افهم سياق المحادثة بالكامل.

اعتمد على الرسائل السابقة عند الإجابة.

لا تطلب معلومات سبق أن أعطاها المستخدم.

أجب بنفس لغة المستخدم.

إذا كان المستخدم عربيًا، استخدم العربية الطبيعية.

كن دقيقًا ومباشرًا.

لا تخترع المعلومات.

إذا لم تكن متأكدًا، قل ذلك.

عند البرمجة:
- أعط كودًا عمليًا.
- استخدم code blocks.
- اشرح الحل عند الحاجة.

لا تكرر المقدمات.

اسمك Zide.

إذا سأل المستخدم من صنعك، قل: زيد.
`;


/* =========================================
   فتح الموقع فورًا
========================================= */

/*
 * مهم:
 * لا ننتظر النموذج حتى تظهر الواجهة.
 *
 * الواجهة تعمل فورًا.
 */

startAI();


/* =========================================
   تشغيل AI بالخلفية
========================================= */

async function startAI(){

 try{

  if(!("gpu" in navigator)){

   throw new Error(
    "WebGPU غير مدعوم في هذا المتصفح."
   );

  }


  loaderText.textContent =
  "جاري تحميل Zide على GPU...";


  ai =
  await pipeline(
   "text-generation",
   MODEL,
   {
    device:"webgpu",
    dtype:"q4f16",

    progress_callback:
    progress
   }
  );


  dot.classList.add("ready");

  status.textContent =
  "محلي • جاهز";

  loaderText.textContent =
  "Zide جاهز ويمكنك البدء.";


  setTimeout(()=>{
   loader.classList.add("hidden");
  },1200);


 }catch(error){

  console.error(error);

  dot.classList.add("error");

  status.textContent =
  "AI غير متاح";

  loaderText.textContent =
  error.message;

 }

}


/* =========================================
   تقدم التحميل
========================================= */

function progress(data){

 if(
  data &&
  data.status === "progress"
 ){

  const p =
  Math.round(data.progress || 0);

  loaderText.textContent =
  `تحميل نموذج Zide... ${p}%`;

 }

}


/* =========================================
   textarea
========================================= */

input.addEventListener(
"input",
()=>{

 input.style.height =
 "auto";

 input.style.height =
 Math.min(
  input.scrollHeight,
  170
 )+"px";

});


input.addEventListener(
"keydown",
e=>{

 if(
  e.key === "Enter" &&
  !e.shiftKey
 ){

  e.preventDefault();

  composer.requestSubmit();

 }

});


/* =========================================
   الصور
========================================= */

attach.onclick=()=>{
 files.click();
};


files.onchange=()=>{

 addImages(
  Array.from(files)
 );

 files.value="";

};


function addImages(list){

 for(const file of list){

  if(images.length>=4)
  break;

  if(!file.type.startsWith("image/"))
  continue;

  images.push(file);

 }

 renderPreview();

}


function renderPreview(){

 preview.innerHTML="";


 if(!images.length){

  preview.style.display="none";

  return;

 }


 preview.style.display="flex";


 images.forEach(
 (file,index)=>{

  const item =
  document.createElement("div");

  item.className =
  "previewItem";


  const img =
  document.createElement("img");

  img.src =
  URL.createObjectURL(file);


  const remove =
  document.createElement("button");

  remove.className =
  "remove";

  remove.textContent="×";


  remove.onclick=()=>{

   images.splice(index,1);

   renderPreview();

  };


  item.append(
   img,
   remove
  );

  preview.appendChild(item);

 });

}


/* =========================================
   الاقتراحات
========================================= */

document
.querySelectorAll(".card")
.forEach(card=>{

 card.onclick=()=>{

  input.value =
  card.dataset.text;

  input.dispatchEvent(
   new Event("input")
  );

  input.focus();

 };

});


/* =========================================
   إرسال
========================================= */

composer.onsubmit =
async e=>{

 e.preventDefault();


 if(running)
 return;


 const text =
 input.value.trim();


 if(
  !text &&
  !images.length
 )
 return;


 if(!ai){

  alert(
   "Zide ما زال يحمل النموذج. انتظر حتى يصبح جاهزًا."
  );

  return;

 }


 welcome.style.display =
 "none";


 const selected =
 [...images];


 addUser(
  text,
  selected
 );


 history.push({
  role:"user",
  content:
  text ||
  "[صورة مرفقة]"
 });


 history =
 history.slice(
  -MAX_HISTORY
 );


 saveHistory();


 images=[];

 renderPreview();


 input.value="";

 input.style.height="auto";


 await generate();

};


/* =========================================
   توليد
========================================= */

async function generate(){

 running=true;

 controller =
 new AbortController();


 send.style.display="none";

 stop.style.display="block";


 const bubble =
 createAI();


 bubble.innerHTML =
 `
 <div class="typing">
  <i></i>
  <i></i>
  <i></i>
 </div>
 `;


 try{

  const messages = [

   {
    role:"system",
    content:SYSTEM
   },

   ...history.slice(
    -MAX_HISTORY
   )

  ];


  const result =
  await ai(
   messages,
   {
    max_new_tokens:600,

    temperature:.55,

    top_p:.9,

    top_k:40,

    repetition_penalty:1.08,

    do_sample:true,

    return_full_text:false,

    signal:
    controller.signal
   }
  );


  let answer="";


  if(
   result &&
   result[0]
  ){

   answer =
   result[0].generated_text || "";

  }


  answer =
  clean(answer);


  if(!answer)
  answer="لم أستطع توليد إجابة.";


  bubble.innerHTML =
  format(answer);


  history.push({
   role:"assistant",
   content:answer
  });


  history =
  history.slice(
   -MAX_HISTORY
  );


  saveHistory();


  scrollBottom();


 }catch(error){

  if(
   error.name ===
   "AbortError"
  ){

   bubble.innerHTML =
   "تم إيقاف التوليد.";

  }else{

   bubble.innerHTML =
   `<span style="color:#ff7185">
   ${escapeHtml(error.message)}
   </span>`;

  }

 }finally{

  running=false;

  controller=null;

  send.style.display="block";

  stop.style.display="none";

 }

}


/* =========================================
   Stop
========================================= */

stop.onclick=()=>{

 if(controller)
 controller.abort();

};


/* =========================================
   User
========================================= */

function addUser(text,list){

 const message =
 document.createElement("div");

 message.className =
 "message user";


 const avatar =
 document.createElement("div");

 avatar.className =
 "avatar";

 avatar.textContent =
 "أنت";


 const content =
 document.createElement("div");

 content.className =
 "content";


 const name =
 document.createElement("div");

 name.className =
 "name";

 name.textContent =
 "أنت";


 const bubble =
 document.createElement("div");

 bubble.className =
 "bubble";


 list.forEach(file=>{

  const img =
  document.createElement("img");

  img.src =
  URL.createObjectURL(file);

  bubble.appendChild(img);

 });


 if(text){

  const div =
  document.createElement("div");

  div.innerHTML =
  format(text);

  bubble.appendChild(div);

 }


 content.append(
  name,
  bubble
 );

 message.append(
  avatar,
  content
 );

 chat.appendChild(
  message
 );


 scrollBottom();

}


/* =========================================
   AI
========================================= */

function createAI(){

 const message =
 document.createElement("div");

 message.className =
 "message ai";


 const avatar =
 document.createElement("div");

 avatar.className =
 "avatar";

 avatar.textContent =
 "Z";


 const content =
 document.createElement("div");

 content.className =
 "content";


 const name =
 document.createElement("div");

 name.className =
 "name";

 name.textContent =
 "Zide";


 const bubble =
 document.createElement("div");

 bubble.className =
 "bubble";


 content.append(
  name,
  bubble
 );

 message.append(
  avatar,
  content
 );


 chat.appendChild(
  message
 );


 return bubble;

}


/* =========================================
   Markdown
========================================= */

function format(text){

 let x =
 escapeHtml(text);


 x =
 x.replace(
  /```(?:[a-zA-Z0-9_+-]+)?\s*\n?([\s\S]*?)```/g,
  "<pre><code>$1</code></pre>"
 );


 x =
 x.replace(
  /\*\*(.*?)\*\*/g,
  "<strong>$1</strong>"
 );


 x =
 x.replace(
  /`([^`]+)`/g,
  "<code>$1</code>"
 );


 x =
 x.replace(
  /\n/g,
  "<br>"
 );


 return x;

}


/* =========================================
   Clean
========================================= */

function clean(text){

 return String(text)
 .replaceAll(
  "<|im_end|>",
  ""
 )
 .replaceAll(
  "<|endoftext|>",
  ""
 )
 .trim();

}


/* =========================================
   Escape
========================================= */

function escapeHtml(text){

 return String(text)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


/* =========================================
   Memory
========================================= */

function saveHistory(){

 try{

  localStorage.setItem(
   "zide_history",
   JSON.stringify(history)
  );

 }catch{}

}


function loadHistory(){

 try{

  const data =
  JSON.parse(
   localStorage.getItem(
    "zide_history"
   ) || "[]"
  );


  if(
   !Array.isArray(data)
  )
  return;


  history =
  data.slice(
   -MAX_HISTORY
  );


  for(
   const item of history
  ){

   if(
    item.role==="user"
   ){

    addUser(
     item.content,
     []
    );

   }


   if(
    item.role==="assistant"
   ){

    const bubble =
    createAI();

    bubble.innerHTML =
    format(item.content);

   }

  }


  if(history.length){

   welcome.style.display =
   "none";

  }

 }catch{}

}


function scrollBottom(){

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });

}

</script>

</body>
</html>
