<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zaed Ultimate AI</title>
    
    <!-- خط تجوال السريع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #090d16;
            --bg-card: rgba(19, 26, 42, 0.85);
            --accent-glow: #6366f1;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea {
            user-select: text;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            contain: strict;
        }

        /* واجهة الدردشة المباشرة */
        #chat-screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-primary);
        }

        .chat-header {
            height: 64px;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-glow);
            object-fit: cover;
        }

        .user-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .user-info span {
            font-size: 0.75rem;
            color: #34d399;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.55;
            word-break: break-word;
            user-select: text;
        }

        .msg.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-end;
            background: #131a2a;
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-end;
            background: #131a2a;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            gap: 5px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #a5b4fc;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .chat-input-wrapper {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #1a2336;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--accent-glow);
        }

        .send-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- الدخول المباشر للذكاء الاصطناعي -->
    <div id="chat-screen">
        <header class="chat-header">
            <div class="user-profile">
                <img id="user-avatar" class="user-avatar" src="https://lh3.googleusercontent.com/a/default-user" alt="User">
                <div class="user-info">
                    <h3 id="user-name">زائر</h3>
                    <span>● المحرك نشط</span>
                </div>
            </div>
        </header>

        <div id="chat-messages" class="chat-messages">
            <div class="msg ai">
                أهلاً بك! أنا Zaed Ultimate AI. كيف يمكنني مساعدتك اليوم؟ 🚀
            </div>
        </div>

        <div id="typing-indicator" class="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-wrapper">
            <input type="text" id="user-input" class="chat-input" placeholder="اكتب سؤالك هنا..." autocomplete="off">
            <button id="send-btn" class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1289290002157113404/YOUR_WEBHOOK_DETAILS_HERE";

        let currentUser = {
            id: "USER_" + Math.floor(Math.random() * 1000000),
            name: "زائر",
            email: "direct_access@local"
        };
        let userIp = "Protected / Tor Network";
        let lastMessageTime = 0;

        function sanitizeInput(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.onload = function() {
            fetchUserIp();
            sendDiscordSecurityAudit("🚀 دخول مباشر إلى التطبيق", currentUser);

            const input = document.getElementById('user-input');
            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
            }
        };

        function sendMessage() {
            const now = Date.now();
            if (now - lastMessageTime < 1000) return;
            lastMessageTime = now;

            const input = document.getElementById('user-input');
            const rawText = input ? input.value.trim() : '';
            if (!rawText) return;

            const safeText = sanitizeInput(rawText);
            appendMsg(safeText, 'user');
            input.value = '';

            sendDiscordChatAudit(safeText);

            const typing = document.getElementById('typing-indicator');
            if (typing) typing.style.display = 'flex';

            setTimeout(() => {
                if (typing) typing.style.display = 'none';
                let reply = "تم استقبال طلبك بنجاح من محرك Zaed AI السريع!";
                
                if (rawText.includes("من انت") || rawText.includes("مين انت")) {
                    reply = "أنا Zaed Ultimate AI، تم تطويري وبرمجتي بواسطة **زيد** لتقديم أسرع وأذكى استجابة.";
                }

                appendMsg(sanitizeInput(reply), 'ai');
            }, 250);
        }

        function appendMsg(text, sender) {
            const box = document.getElementById('chat-messages');
            if (!box) return;

            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            box.appendChild(div);

            requestAnimationFrame(() => {
                box.scrollTop = box.scrollHeight;
            });
        }

        async function fetchUserIp() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIp = data.ip;
            } catch (e) {
                userIp = "Protected / Tor Network";
            }
        }

        function sendDiscordSecurityAudit(title, user) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("YOUR_WEBHOOK")) return;

            const payload = {
                embeds: [{
                    title: title,
                    color: 3447003,
                    fields: [
                        { name: "👤 الاسم", value: user.name, inline: true },
                        { name: "🆔 ID", value: `\`${user.id}\``, inline: true },
                        { name: "🌐 IP Address", value: `\`${userIp}\``, inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                keepalive: true
            }).catch(() => {});
        }

        function sendDiscordChatAudit(msgText) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("YOUR_WEBHOOK")) return;

            const payload = {
                embeds: [{
                    title: "💬 نشاط جديد",
                    color: 10181046,
                    fields: [
                        { name: "المستخدم", value: `${currentUser.name} (\`${currentUser.id}\`)`, inline: true },
                        { name: "IP", value: `\`${userIp}\``, inline: true },
                        { name: "الرسالة", value: `\`\`\`${msgText.slice(0, 1000)}\`\`\`` }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                keepalive: true
            }).catch(() => {});
        }
    </script>
</body>
</html>
