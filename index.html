<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zide — Search</title>

<style>
:root {
    --bg: #080b12;
    --panel: rgba(17, 22, 34, .78);
    --panel-2: #111827;
    --text: #f5f7ff;
    --muted: #8993a8;
    --border: rgba(255,255,255,.08);

    --primary: #6575ff;
    --purple: #9b5cff;
    --cyan: #24d9ff;
    --success: #35df91;
    --danger: #ff5c77;

    --shadow:
        0 25px 80px rgba(0,0,0,.45);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(101,117,255,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(155,92,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(36,217,255,.08),
            transparent 35%
        ),
        var(--bg);
}

/* ================================
   HEADER
================================ */

.header {
    width: min(1180px, calc(100% - 32px));
    margin: auto;

    padding: 22px 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 22px;
    font-weight: 900;
    letter-spacing: -.7px;
}

.logo-mark {
    width: 39px;
    height: 39px;

    display: grid;
    place-items: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--purple)
        );

    box-shadow:
        0 8px 30px rgba(101,117,255,.35);

    font-weight: 900;
}

.logo span {
    color: #aeb7ff;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 12px;

    color: var(--text);
    background: rgba(255,255,255,.04);

    cursor: pointer;

    transition: .2s;
}

.icon-btn:hover {
    background: rgba(255,255,255,.08);
    transform: translateY(-1px);
}

/* ================================
   HERO
================================ */

.hero {
    width: min(900px, calc(100% - 32px));

    margin:
        70px
        auto
        35px;

    text-align: center;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 12px;

    border: 1px solid rgba(101,117,255,.2);
    border-radius: 999px;

    background: rgba(101,117,255,.08);

    color: #aeb7ff;
    font-size: 12px;
}

.badge-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--success);

    box-shadow:
        0 0 12px var(--success);
}

.hero h1 {
    margin:
        22px
        0
        12px;

    font-size:
        clamp(42px, 8vw, 76px);

    line-height: .95;
    letter-spacing: -4px;
}

.gradient {
    background:
        linear-gradient(
            100deg,
            #fff,
            #9da8ff 45%,
            #b875ff
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero p {
    margin: 0 auto;

    max-width: 600px;

    color: var(--muted);

    line-height: 1.8;
}

/* ================================
   SEARCH
================================ */

.search-shell {
    width: min(900px, calc(100% - 32px));
    margin: auto;
}

.search-box {
    position: relative;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 22px;

    background:
        rgba(15,20,31,.78);

    backdrop-filter:
        blur(20px);

    box-shadow:
        var(--shadow);

    transition: .25s;
}

.search-box:focus-within {
    border-color:
        rgba(101,117,255,.55);

    box-shadow:
        0 0 0 4px rgba(101,117,255,.08),
        0 25px 80px rgba(0,0,0,.45);
}

.search-icon {
    width: 45px;
    flex: 0 0 45px;

    display: grid;
    place-items: center;

    color: #8995ff;
    font-size: 20px;
}

#query {
    min-width: 0;
    flex: 1;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    padding: 14px 5px;

    font-size: 16px;
}

#query::placeholder {
    color: #667087;
}

.engine {
    height: 45px;

    border:
        1px solid
        var(--border);

    border-radius: 13px;

    padding:
        0
        11px;

    color: var(--text);

    background:
        #151c2b;

    outline: 0;

    cursor: pointer;
}

.search-btn {
    height: 45px;

    padding:
        0
        18px;

    border: 0;
    border-radius: 14px;

    color: white;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--purple)
        );

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(83,92,255,.25);

    transition: .2s;
}

.search-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
}

.search-btn:active {
    transform: scale(.97);
}

/* ================================
   QUICK ENGINES
================================ */

.engines {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;

    gap: 8px;

    margin-top: 16px;
}

.engine-chip {
    border:
        1px solid
        var(--border);

    border-radius: 999px;

    padding:
        7px
        12px;

    color: #9ba5b9;

    background:
        rgba(255,255,255,.025);

    cursor: pointer;

    font-size: 12px;

    transition: .2s;
}

.engine-chip:hover {
    color: white;
    border-color: rgba(101,117,255,.35);
    background: rgba(101,117,255,.08);
}

/* ================================
   RESULTS
================================ */

.results {
    width: min(900px, calc(100% - 32px));

    margin:
        45px
        auto
        80px;
}

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.results-title {
    font-size: 14px;
    font-weight: 800;
}

.results-status {
    color: var(--muted);
    font-size: 12px;
}

.result {
    padding: 20px;

    margin-bottom: 10px;

    border:
        1px solid
        var(--border);

    border-radius: 18px;

    background:
        rgba(16,22,34,.65);

    transition: .2s;
}

.result:hover {
    border-color:
        rgba(101,117,255,.25);

    transform:
        translateY(-2px);
}

.result-source {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #7783ff;

    font-size: 11px;
    font-weight: 700;

    margin-bottom: 8px;
}

.result h3 {
    margin:
        0
        0
        8px;

    font-size: 17px;
}

.result h3 a {
    color: white;
    text-decoration: none;
}

.result h3 a:hover {
    color: #aeb7ff;
}

.result p {
    margin: 0;

    color: #929caf;

    font-size: 13px;

    line-height: 1.8;
}

.result-url {
    display: block;

    margin-top: 10px;

    color: #4ddbb4;

    font-size: 11px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.empty {
    padding: 50px 20px;

    text-align: center;

    color: var(--muted);
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

/* ================================
   FOOTER
================================ */

footer {
    width: min(900px, calc(100% - 32px));

    margin: auto;

    padding:
        20px
        0
        35px;

    color: #596378;

    text-align: center;

    font-size: 11px;
}

footer strong {
    color: #818cff;
}

/* ================================
   TOAST
================================ */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translate(-50%, 100px);

    padding:
        12px
        18px;

    border:
        1px solid
        var(--border);

    border-radius: 14px;

    color: white;

    background:
        rgba(17,24,39,.94);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    opacity: 0;

    transition: .3s;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* ================================
   MOBILE
================================ */

@media (max-width: 650px) {

    .header {
        padding-top: 15px;
    }

    .hero {
        margin-top: 45px;
    }

    .hero h1 {
        letter-spacing: -2px;
    }

    .search-box {
        flex-wrap: wrap;
        padding: 8px;
    }

    .search-icon {
        width: 38px;
        flex-basis: 38px;
    }

    #query {
        flex-basis: calc(100% - 55px);
    }

    .engine {
        flex: 1;
    }

    .search-btn {
        flex: 1;
    }

    .results {
        margin-top: 30px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <div class="logo-mark">Z</div>
        <div>Zide<span>.</span></div>
    </div>

    <div class="header-actions">
        <button
            class="icon-btn"
            id="clearBtn"
            title="مسح">
            ×
        </button>
    </div>

</header>


<main>

<section class="hero">

    <div class="badge">
        <span class="badge-dot"></span>
        بحث مجاني ومتعدد المصادر
    </div>

    <h1>
        ابحث بذكاء مع
        <span class="gradient">Zide</span>
    </h1>

    <p>
        محرك بحث بسيط وسريع يجمع لك الوصول إلى
        Google وBing وDuckDuckGo وWikipedia
        من واجهة واحدة.
    </p>

</section>


<section class="search-shell">

    <form class="search-box" id="searchForm">

        <div class="search-icon">⌕</div>

        <input
            id="query"
            type="search"
            autocomplete="off"
            placeholder="ماذا تريد أن تبحث؟"
            aria-label="بحث"
        >

        <select
            id="engine"
            class="engine"
            aria-label="محرك البحث">

            <option value="google">
                Google
            </option>

            <option value="bing">
                Bing
            </option>

            <option value="duck">
                DuckDuckGo
            </option>

            <option value="wiki">
                Wikipedia
            </option>

        </select>

        <button
            class="search-btn"
            type="submit">
            بحث
        </button>

    </form>


    <div class="engines">

        <button
            class="engine-chip"
            data-engine="google">
            Google
        </button>

        <button
            class="engine-chip"
            data-engine="bing">
            Bing
        </button>

        <button
            class="engine-chip"
            data-engine="duck">
            DuckDuckGo
        </button>

        <button
            class="engine-chip"
            data-engine="wiki">
            Wikipedia
        </button>

    </div>

</section>


<section class="results" id="results">

    <div class="results-header">

        <div class="results-title">
            نتائج Zide
        </div>

        <div
            class="results-status"
            id="status">
            جاهز للبحث
        </div>

    </div>

    <div class="empty">

        <div class="empty-icon">
            ✦
        </div>

        <div>
            اكتب كلمة أو سؤالاً للبدء
        </div>

    </div>

</section>

</main>


<footer>
    <strong>Zide</strong>
    — واجهة بحث مجانية بدون API Key
</footer>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================================
   ZIDE SEARCH ENGINE
========================================= */

const form = document.getElementById("searchForm");
const queryInput = document.getElementById("query");
const engineSelect = document.getElementById("engine");
const results = document.getElementById("results");
const statusText = document.getElementById("status");
const toast = document.getElementById("toast");
const clearBtn = document.getElementById("clearBtn");


/* =========================================
   SEARCH URLS
========================================= */

const engines = {

    google: query =>
        "https://www.google.com/search?q="
        + encodeURIComponent(query),

    bing: query =>
        "https://www.bing.com/search?q="
        + encodeURIComponent(query),

    duck: query =>
        "https://duckduckgo.com/?q="
        + encodeURIComponent(query),

    wiki: query =>
        "https://www.wikipedia.org/w/index.php?search="
        + encodeURIComponent(query)

};


/* =========================================
   SEARCH
========================================= */

form.addEventListener("submit", async event => {

    event.preventDefault();

    const query =
        queryInput.value.trim();

    const engine =
        engineSelect.value;

    if (!query) {

        showToast(
            "اكتب شيئاً للبحث أولاً"
        );

        queryInput.focus();

        return;
    }


    if (engine === "wiki") {

        await wikipediaSearch(query);

        return;
    }


    /*
       المحركات الخارجية:
       لا تحتاج API Key.
       يتم فتح البحث مباشرة.
    */

    window.open(
        engines[engine](query),
        "_blank",
        "noopener,noreferrer"
    );

});


/* =========================================
   WIKIPEDIA SEARCH
========================================= */

async function wikipediaSearch(query) {

    setStatus("جاري البحث...");

    results.innerHTML = `

        <div class="results-header">

            <div class="results-title">
                نتائج Wikipedia
            </div>

            <div class="results-status">
                البحث...
            </div>

        </div>

        <div class="empty">
            جاري جلب النتائج
        </div>

    `;


    try {

        const url =
            "https://en.wikipedia.org/w/api.php"
            + "?action=query"
            + "&generator=search"
            + "&gsrsearch="
            + encodeURIComponent(query)
            + "&gsrlimit=8"
            + "&prop=extracts|info"
            + "&exintro=1"
            + "&explaintext=1"
            + "&inprop=url"
            + "&format=json"
            + "&origin=*";


        const response =
            await fetch(url);


        if (!response.ok) {
            throw new Error(
                "Wikipedia request failed"
            );
        }


        const data =
            await response.json();


        const pages =
            Object.values(
                data.query?.pages || {}
            );


        renderWikipedia(
            pages,
            query
        );


    } catch (error) {

        console.error(error);

        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠
                </div>

                <div>
                    تعذر تحميل النتائج حالياً.
                </div>

            </div>

        `;

        setStatus("حدث خطأ");

    }

}


/* =========================================
   RENDER RESULTS
========================================= */

function renderWikipedia(
    pages,
    query
) {

    results.innerHTML = `

        <div class="results-header">

            <div class="results-title">
                نتائج لـ "${escapeHTML(query)}"
            </div>

            <div class="results-status">
                Wikipedia
            </div>

        </div>

    `;


    if (!pages.length) {

        results.innerHTML += `

            <div class="empty">

                <div class="empty-icon">
                    ◌
                </div>

                <div>
                    لم نجد نتائج في Wikipedia.
                </div>

            </div>

        `;

        setStatus("لا توجد نتائج");

        return;
    }


    pages.forEach(page => {

        const article =
            document.createElement("article");

        article.className = "result";


        const title =
            page.title || "بدون عنوان";

        const extract =
            page.extract ||
            "لا يوجد وصف متاح لهذا المقال.";

        const url =
            page.fullurl ||
            `https://en.wikipedia.org/wiki/${
                encodeURIComponent(
                    title.replaceAll(" ", "_")
                )
            }`;


        article.innerHTML = `

            <div class="result-source">
                WIKIPEDIA
            </div>

            <h3>
                <a
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    ${escapeHTML(title)}
                </a>
            </h3>

            <p>
                ${escapeHTML(
                    extract.substring(0, 450)
                )}
            </p>

            <span class="result-url">
                ${escapeHTML(url)}
            </span>

        `;


        results.appendChild(article);

    });


    setStatus(
        `${pages.length} نتائج`
    );

}


/* =========================================
   QUICK ENGINE BUTTONS
========================================= */

document
    .querySelectorAll(".engine-chip")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const engine =
                    button.dataset.engine;

                engineSelect.value =
                    engine;

                queryInput.focus();

                if (queryInput.value.trim()) {

                    form.requestSubmit();

                }

            }
        );

    });


/* =========================================
   CLEAR
========================================= */

clearBtn.addEventListener(
    "click",
    () => {

        queryInput.value = "";

        results.innerHTML = `

            <div class="results-header">

                <div class="results-title">
                    نتائج Zide
                </div>

                <div class="results-status">
                    جاهز للبحث
                </div>

            </div>

            <div class="empty">

                <div class="empty-icon">
                    ✦
                </div>

                <div>
                    اكتب كلمة أو سؤالاً للبدء
                </div>

            </div>

        `;

        setStatus("جاهز للبحث");

        queryInput.focus();

    }
);


/* =========================================
   KEYBOARD SHORTCUT
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "/" &&
            document.activeElement !== queryInput
        ) {

            event.preventDefault();

            queryInput.focus();

        }

    }
);


/* =========================================
   HELPERS
========================================= */

function setStatus(text) {

    statusText.textContent =
        text;

}


function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    }, 2200);

}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}

</script>

</body>
</html>
