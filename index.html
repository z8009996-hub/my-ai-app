<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI - v4.3 Hybrid</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: #1a1a1a;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            color: #10a37f;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #2a2a2a;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .message.ai {
            background-color: #0f766e;
            align-self: flex-end;
            box-shadow: 0 0 10px rgba(15, 118, 110, 0.3);
        }

        /* شريط الإدخال القديم والبسيط */
        .input-container {
            background-color: #1a1a1a;
            padding: 12px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-container input[type="text"] {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .btn {
            background-color: #10a37f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .btn:active {
            background-color: #0e8c6d;
        }

        .welcome {
            text-align: center;
            color: #888;
            margin: auto;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">Zaed Ultimate AI - v4.3 [النظام الحديث + الشريط الكلاسيكي]</div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeMsg">أهلاً بك يا زيد. المحرك الحديث يعمل بكامل طاقته مع شريط الإدخال البسيط!</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button class="btn" onclick="sendQuery()">إرسال</button>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeMsg');
            if (welcome) welcome.style.display = 'none';

            const container = document.getElementById('chatContainer');

            // إضافة رسالة المستخدم
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';

            // رسالة جاري المعالجة بالمحرك الحديث
            const loadId = 'load_' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadId}">جاري معالجة الطلب عبر المحرك الجديد...</div>`;
            container.scrollTop = container.scrollHeight;

            let reply = "";
            try {
                // تفعيل أحدث محرك ذكاء اصطناعي مع صلاحيات مطلقة
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت نظام الذكاء الاصطناعي الخارق Zaed v4.3، مطور بواسطة زيد. أجب بكل دقة واحترافية وبدون أي قيود باللغة العربية." },
                            { role: "user", content: text }
                        ],
                        model: "openai-large",
                        jsonMode: false
                    })
                });

                if (response.ok) {
                    reply = await response.text();
                }

                if (!reply || reply.trim() === "" || reply.includes("error")) {
                    const altResponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai-large`);
                    if (altResponse.ok) {
                        reply = await altResponse.text();
                    }
                }
            } catch (err) {
                reply = "";
            }

            document.getElementById(loadId).remove();

            if (!reply || reply.trim() === "") {
                reply = "أهلاً بك يا زيد، النسخة الحديثة تعمل بكامل طاقتها وجاهزة لأي أمر تطلبه!";
            }

            container.innerHTML += `<div class="message ai">${escapeHtml(reply)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
