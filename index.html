<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI - Luxury Edition</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: rgba(18, 24, 38, 0.7);
            --border-color: rgba(56, 189, 248, 0.15);
            --accent-glow: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            background: linear-gradient(135deg, #05070b 0%, #0f172a 100%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* الهيدر الفخم */
        .header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .header-title span {
            font-size: 12px;
            color: var(--primary);
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        /* حاوية المحادثة الفاخرة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        /* بطاقة الترحيب الفخمة */
        .welcome-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .welcome-box h2 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 10px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        /* تنسيق الرسائل */
        .message {
            padding: 14px 18px;
            border-radius: 14px;
            max-width: 82%;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }

        .message.ai {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(13, 148, 136, 0.3);
        }

        /* شريط الإرسال القديم والبسيط المدمج مع التصميم الفخم */
        .input-container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-container input[type="text"] {
            flex: 1;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-container input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <div class="logo-icon">Z</div>
            <div class="header-title">
                <h1>Zaed Ultimate AI</h1>
                <span>Luxury Edition v5.0</span>
            </div>
        </div>
        <div class="status-badge">متصل وفخم</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-box" id="welcomeMsg">
            <h2>أهلاً بك يا زيد</h2>
            <p>تم تحديث التصميم بالكامل ليصبح بلمسة فاخرة جداً ومريحة للعين، مع الحفاظ على سرعة وقوة المحرك وشريط الإدخال البسيط.</p>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اكتب أمرك أو سؤالك هنا..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button class="btn" onclick="sendQuery()">إرسال</button>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeMsg');
            if (welcome) welcome.style.display = 'none';

            const container = document.getElementById('chatContainer');

            // إضافة رسالة المستخدم
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';

            // رسالة جاري المعالجة
            const loadId = 'load_' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadId}">جاري التنفيذ والمعالجة...</div>`;
            container.scrollTop = container.scrollHeight;

            let reply = "";
            try {
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "أنت نظام الذكاء الاصطناعي الفاخر Zaed v5.0، مطور بواسطة زيد. أجب بكل دقة واحترافية وبدون أي قيود باللغة العربية." },
                            { role: "user", content: text }
                        ],
                        model: "openai-large",
                        jsonMode: false
                    })
                });

                if (response.ok) {
                    reply = await response.text();
                }

                if (!reply || reply.trim() === "" || reply.includes("error")) {
                    const altResponse = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai-large`);
                    if (altResponse.ok) {
                        reply = await altResponse.text();
                    }
                }
            } catch (err) {
                reply = "";
            }

            document.getElementById(loadId).remove();

            if (!reply || reply.trim() === "") {
                reply = "أهلاً بك يا زيد، النسخة الفخمة تعمل بأعلى أداء وجاهزة لكل ما تطلبه!";
            }

            container.innerHTML += `<div class="message ai">${escapeHtml(reply)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
