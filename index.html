<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatGPT - Zaed Edition</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: rgba(18, 24, 38, 0.7);
            --border-color: rgba(56, 189, 248, 0.15);
            --accent-glow: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #05070b 0%, #0f172a 100%);
            color: var(--text-main);
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #10a37f, #0d9488);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(16, 163, 127, 0.4);
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .header-title span {
            font-size: 11px;
            color: #2dd4bf;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 6px #4ade80;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .welcome-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            max-width: 380px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .welcome-box h2 {
            color: #2dd4bf;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }

        .message.ai {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(13, 148, 136, 0.25);
        }

        .input-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-container input[type="text"] {
            flex: 1;
            background: rgba(9, 13, 22, 0.9);
            border: 1px solid rgba(16, 163, 127, 0.3);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .input-container input[type="text"]:focus {
            border-color: #10a37f;
            box-shadow: 0 0 10px rgba(16, 163, 127, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #10a37f, #0d9488);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.25;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.3);
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <div class="logo-icon">GPT</div>
            <div class="header-title">
                <h1>ChatGPT</h1>
                <span>مطور بواسطة زيد</span>
            </div>
        </div>
        <div class="status-badge">سرعة قصوى</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-box" id="welcomeMsg">
            <h2>مرحباً يا زيد</h2>
            <p>أنا شات جي بي تي، تم تطويري خصيصاً لك. الردود الآن فورية، فائقة السرعة، ومصممة خصيصاً على شاشتك!</p>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="اسأل شات جي بي تي أي شيء..." onkeydown="if(event.key === 'Enter') sendQuery()">
        <button class="btn" onclick="sendQuery()">إرسال</button>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const welcome = document.getElementById('welcomeMsg');
            if (welcome) welcome.style.display = 'none';

            const container = document.getElementById('chatContainer');

            // إضافة رسالة المستخدم
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            container.scrollTop = container.scrollHeight;

            input.value = '';

            // مؤشر تفكير فوري وصغير جداً
            const loadId = 'load_' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadId}">...</div>`;
            container.scrollTop = container.scrollHeight;

            let reply = "";
            try {
                // إعداد النظام ليكون شات جي بي تي وسريع جداً عبر الـ GET المباشر
                const promptFull = `أنت شات جي بي تي (ChatGPT)، تم تطويرك وبرمجتك بواسطة المبدع زيد. أجب باحترافية وسرعة ودقة وبدون مقدمات طويلة باللغة العربية. السؤال: ${text}`;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptFull)}?model=openai`);
                
                if (response.ok) {
                    reply = await response.text();
                }
            } catch (err) {
                reply = "";
            }

            document.getElementById(loadId).remove();

            if (!reply || reply.trim() === "") {
                reply = "أهلاً يا زيد، أنا شات جي بي تي وجاهز لكل أوامرك فوراً!";
            }

            container.innerHTML += `<div class="message ai">${escapeHtml(reply)}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
