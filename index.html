<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        /* الهيدر العلوي */
        .header {
            background-color: #141923;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222938;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background-color: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .status-info h2 {
            font-size: 16px;
            color: #fff;
        }

        .status-info p {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* منطقة المحادثة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* رسائل الذكاء الاصطناعي */
        .message.ai {
            background-color: #1a202c;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid #2d3748;
        }

        /* رسائل المستخدم */
        .message.user {
            background-color: #6366f1;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        /* رسالة الانتظار */
        .message.loading {
            background-color: #1a202c;
            color: #a0aec0;
            align-self: flex-start;
            font-style: italic;
        }

        /* منطقة الإدخال بالأسفل (مرتبة وصحيحة للغة العربية) */
        .input-container {
            padding: 15px 20px;
            background-color: #141923;
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;
            border-top: 1px solid #222938;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #fff;
            font-size: 15px;
            outline: none;
            text-align: right;
        }

        .input-container input:focus {
            border-color: #6366f1;
        }

        .input-container button {
            padding: 12px 24px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="header">
        <div class="avatar">Z</div>
        <div class="status-info">
            <h2>Zaed Ultimate AI</h2>
            <p><span class="status-dot"></span> الذكاء الاصطناعي متصل</p>
        </div>
    </div>

    <!-- حاوية الرسائل -->
    <div class="chat-container" id="chat-box">
        <div class="message ai">أهلاً بك يا زيد! أنا محركك الذكي المتطور، جاهز تماماً لتلقي أسئلتك وإعطائك إجابات دقيقة ومبتكرة. 🚀</div>
    </div>

    <!-- حقل الكتابة والزر -->
    <div class="input-container">
        <button onclick="sendMessage()">إرسال</button>
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
    </div>

    <!-- كود الجافاسكربت المحسّن بالمحركات المتعددة -->
    <script>
        // دالة جلب الرد من عدة محركات ذكاء اصطناعي لضمان إجابة حقيقية وذكية لكل سؤال
        async function getAIResponse(userQuery) {
            const queryLower = userQuery.trim().toLowerCase();

            // 1. فحص الأسئلة الخاصة بالمطور والمخترع
            if (queryLower.includes("من مخترعك") || queryLower.includes("من صنعك") || queryLower.includes("من برمك") || queryLower.includes("من هو زيد") || queryLower.includes("مين مطورك")) {
                return "أنا نموذج ذكاء اصطناعي تم تطويري وابتكاري بالكامل بواسطة المبدع زيد! 🛠️✨";
            }

            // 2. المحرك الأول: محاولة الاتصال بنظام الـ API الذكي مع تنويع الـ Seed لمنع تكرار الإجابات الثابتة
            try {
                const systemPrompt = "أنت ذكاء اصطناعي متطور جداً وسريع، اسمك Zaed Ultimate AI، طورك وبرمجك المطور زيد. أجب على كل سؤال بذكاء، عمق وتنوع تام باللغة العربية ودون تكرار.";
                const randomSeed = Math.floor(Math.random() * 100000);
                const apiUrl = `https://text.pollinations.ai/${encodeURIComponent(userQuery)}?system=${encodeURIComponent(systemPrompt)}&seed=${randomSeed}&model=openai`;
                
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const aiText = await response.text();
                    if (aiText && aiText.trim().length > 3 && !aiText.toLowerCase().includes("error")) {
                        return aiText.trim();
                    }
                }
            } catch (e) {
                console.log("محرك 1 تعذر الاتصال به، جاري التبديل للمحرك البديل...");
            }

            // 3. المحرك الثاني: محاولة اتصال بديلة عبر مسار مختلف من نفس الشبكة
            try {
                const altApiUrl = `https://text.pollinations.ai/prompt/${encodeURIComponent(userQuery)}`;
                const altResponse = await fetch(altApiUrl);
                if (altResponse.ok) {
                    const altText = await altResponse.text();
                    if (altText && altText.trim().length > 3) {
                        return altText.trim();
                    }
                }
            } catch (e) {}

            // 4. المحرك المحلي الذكي (يتفاعل بمرونة عالية مع الأسئلة الشائعة)
            if (queryLower.includes("كيف حالك") || queryLower.includes("كيفك") || queryLower.includes("اخبارك") || queryLower.includes("شلونك")) {
                return "أنا بأفضل حال وجاهز تماماً لدعمك وإنجاز مهامك يا زيد! أنت طمني عنك وعن أخبارك؟ 🌟";
            }
            if (queryLower.includes("مرحبا") || queryLower.includes("هلا") || queryLower.includes("أهلا") || queryLower.includes("السلام عليكم") || queryLower.includes("الو")) {
                return "وعليكم السلام ورحمة الله وبركاته! أهلاً بك يا زيد، تفضل بطرح سؤالك أو الموضوع الذي تريد مناقشته. 😊";
            }
            if (queryLower.includes("شو اسمك") || queryLower.includes("اسمك") || queryLower.includes("مين انت") || queryLower.includes("انتا مين") || queryLower.includes("من انت")) {
                return "أنا Zaed Ultimate AI، نظامك الذكي الخاص والمبرمج بواسطة الإبداع الذي تمتلكه! 💻🚀";
            }

            // رد تحليل عام متجدد ومتنوع
            return `لقد استلمت سؤالك (${userQuery}). جاري معالجة البيانات وتحليلها لتقديم أفضل إجابة دقيقة ومفيدة لك يا زيد. هل ترغب في إضافة تفاصيل معينة لنتعمق أكثر؟`;
        }

        // دالة إرسال الرسالة وعرضها في الشاشة
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text) return;

            // 1. إظهار رسالة المستخدم
            const userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. إظهار مؤشر "جاري التفكير..."
            const loadingMsg = document.createElement("div");
            loadingMsg.className = "message loading";
            loadingMsg.textContent = "جاري التفكير والتحليل...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. جلب الرد واستبدال مؤشر التحميل
            const replyText = await getAIResponse(text);
            chatBox.removeChild(loadingMsg);

            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            aiMsg.textContent = replyText;
            chatBox.appendChild(aiMsg);

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
