<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        /* الهيدر العلوي */
        .header {
            background-color: #141923;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222938;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background-color: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .status-info h2 {
            font-size: 16px;
            color: #fff;
        }

        .status-info p {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* منطقة المحادثة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* رسائل الذكاء الاصطناعي */
        .message.ai {
            background-color: #1a202c;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid #2d3748;
        }

        /* رسائل المستخدم */
        .message.user {
            background-color: #6366f1;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            display: block;
        }

        /* رسالة الانتظار */
        .message.loading {
            background-color: #1a202c;
            color: #a0aec0;
            align-self: flex-start;
            font-style: italic;
        }

        /* معاينة الصورة المرفقة قبل الإرسال */
        .image-preview-bar {
            display: none;
            padding: 10px 20px;
            background-color: #181f2c;
            border-top: 1px solid #222938;
            align-items: center;
            gap: 10px;
        }

        .image-preview-bar img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #6366f1;
        }

        .image-preview-bar .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        /* منطقة الإدخال بالأسفل */
        .input-container {
            padding: 15px 20px;
            background-color: #141923;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #222938;
        }

        .input-container input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-container input[type="text"]:focus {
            border-color: #6366f1;
        }

        .attach-btn {
            background-color: #2d3748;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .attach-btn:hover {
            background-color: #3b475d;
        }

        .send-btn {
            padding: 12px 24px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="header">
        <div class="avatar">Z</div>
        <div class="status-info">
            <h2>Zaed Ultimate AI</h2>
            <p><span class="status-dot"></span> متصل (يدعم الصور والتحليل)</p>
        </div>
    </div>

    <!-- حاوية الرسائل -->
    <div class="chat-container" id="chat-box">
        <div class="message ai">أهلاً بك! أنا Zaed Ultimate AI. يمكنك الحديث معي، رفـع صور لتحليلها 📷، أو طلـب رسم صورة 🎨!</div>
    </div>

    <!-- شريط معاينة الصورة قبل الإرسال -->
    <div class="image-preview-bar" id="preview-bar">
        <img id="preview-img" src="" alt="المعاينة">
        <span style="font-size: 13px; color: #a0aec0;">صورة جاهزة للتحليل...</span>
        <button class="remove-btn" onclick="clearSelectedImage()">✕</button>
    </div>

    <!-- حقل الكتابة والزر والملحقات -->
    <div class="input-container">
        <!-- زر اختيار الصورة -->
        <button class="attach-btn" title="إرفاق صورة للتحليل" onclick="document.getElementById('image-input').click()">📷</button>
        <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

        <input type="text" id="user-input" placeholder="اكتب سؤالك أو 'ارسم سيارة رياضية'..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <!-- كود الجافاسكربت المحسّن -->
    <script>
        let selectedBase64Image = null;

        // عند اختيار صورة من جهاز المستخدم
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64Image = e.target.result;
                    document.getElementById('preview-img').src = selectedBase64Image;
                    document.getElementById('preview-bar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        // إلغاء تحديد الصورة
        function clearSelectedImage() {
            selectedBase64Image = null;
            document.getElementById('image-input').value = '';
            document.getElementById('preview-bar').style.display = 'none';
        }

        // 1. دالة جلب النص/التحليل
        async function getAIResponse(userQuery) {
            try {
                const systemPrompt = "أنت ذكاء اصطناعي ذكي وسريع اسمه Zaed Ultimate AI، طورك وبرمجك المطور زيد. أجب دائماً باللغة العربية بأسلوب ذكي ومفيد.";
                const apiUrl = `https://text.pollinations.ai/${encodeURIComponent(userQuery)}?system=${encodeURIComponent(systemPrompt)}`;
                
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const aiText = await response.text();
                    if (aiText && aiText.trim().length > 0) return aiText.trim();
                }
            } catch (e) {
                console.error("AI Fetch Error:", e);
            }

            return "أنا هنا لمساعدتك! يمكنك أن تسألني عن أي موضوع وسأجيبك فوراً.";
        }

        // 2. دالة تحليل الصور (Vision)
        async function analyzeImage(base64Data, userQuery) {
            try {
                const promptText = userQuery || "اشرح بالتفصيل ما بداخل هذه الصورة باللغة العربية.";
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: promptText },
                                    { type: "image_url", image_url: { url: base64Data } }
                                ]
                            }
                        ],
                        model: "openai"
                    })
                });

                if (response.ok) {
                    const resultText = await response.text();
                    if (resultText && resultText.trim().length > 0) return resultText.trim();
                }
            } catch (e) {
                console.error("Vision API Error:", e);
            }
            return "عذراً، تعذر تحليل الصورة في الوقت الحالي. تأكد من جودة الاتصال بالإنترنت حاول مجدداً.";
        }

        // دالة إرسال الرسائل والمعالجة
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text && !selectedBase64Image) return;

            // 1. إظهار رسالة المستخدم في الشاشة
            const userMsg = document.createElement("div");
            userMsg.className = "message user";

            if (selectedBase64Image) {
                const img = document.createElement("img");
                img.src = selectedBase64Image;
                userMsg.appendChild(img);
            }

            if (text) {
                const textSpan = document.createElement("div");
                textSpan.textContent = text;
                userMsg.appendChild(textSpan);
            }

            chatBox.appendChild(userMsg);
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // احتفاظ بنفس البيانات ثم تفريغ الخانة
            const currentImage = selectedBase64Image;
            clearSelectedImage();

            // 2. إظهار مؤشر الانتظار
            const loadingMsg = document.createElement("div");
            loadingMsg.className = "message loading";
            loadingMsg.textContent = currentImage ? "جاري قراءة وتحليل الصورة..." : "جاري التفكير والتحليل...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. اتخاذ القرار: هل الطلب تحليل صورة أم توليد صورة أم سؤال عادي؟
            let replyText = "";
            let generatedImgUrl = null;

            const lowerText = text.toLowerCase();
            const isImageGen = !currentImage && (lowerText.startsWith("ارسم") || lowerText.includes("صورة ل") || lowerText.includes("توليد صورة") || lowerText.startsWith("draw"));

            if (currentImage) {
                // حالة 1: تحليل صورة تم رفعها
                replyText = await analyzeImage(currentImage, text);
            } else if (isImageGen) {
                // حالة 2: توليد صورة بناءً على الوصف
                loadingMsg.textContent = "جاري رسم الصورة بالذكاء الاصطناعي... 🎨";
                let cleanPrompt = text.replace(/ارسم|توليد صورة|صورة لـ|صورة/g, "").trim() || text;
                generatedImgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
                replyText = `تفضل! هذه هي الصورة بناءً على طلبك: "${cleanPrompt}" 🎨`;
            } else {
                // حالة 3: سؤال نصي عادي
                replyText = await getAIResponse(text);
            }

            // إزالة مؤشر التحميل
            chatBox.removeChild(loadingMsg);

            // عرض رد الذكاء الاصطناعي
            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            
            const txtDiv = document.createElement("div");
            txtDiv.textContent = replyText;
            aiMsg.appendChild(txtDiv);

            if (generatedImgUrl) {
                const aiImg = document.createElement("img");
                aiImg.src = generatedImgUrl;
                aiImg.alt = "AI Generated Image";
                aiMsg.appendChild(aiImg);
            }

            chatBox.appendChild(aiMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
