<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <meta
        name="description"
        content="Zaed AI Engine - واجهة ذكاء اصطناعي متطورة"
    >

    <title>Zaed AI Engine</title>

    <style>
        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg: #05070d;
            --bg-soft: #080b14;

            --panel: rgba(12, 17, 29, 0.88);
            --panel-light: rgba(255, 255, 255, 0.045);

            --border: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(91, 140, 255, 0.42);

            --text: #f5f7ff;
            --muted: #8994aa;

            --primary: #5b8cff;
            --primary-dark: #4167db;
            --purple: #7c4dff;
            --cyan: #00d4ff;

            --success: #31d68b;
            --danger: #ff5577;

            --user-gradient:
                linear-gradient(
                    135deg,
                    #285bdc,
                    #5a35c7
                );

            --ai-gradient:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.02)
                );

            --shadow:
                0 20px 70px rgba(0, 0, 0, .48);

            --radius: 20px;
        }

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100%;
            overflow: hidden;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(65, 105, 255, .14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(0, 212, 255, .08),
                    transparent 30%
                ),
                var(--bg);

            font-family:
                Inter,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        /* =========================================================
           APPLICATION
        ========================================================= */

        .app {
            position: relative;

            width: 100%;
            height: 100dvh;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }

        .orb {
            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            filter: blur(90px);
            opacity: .17;

            animation:
                floatOrb 14s ease-in-out infinite;
        }

        .orb.one {
            top: -150px;
            left: -100px;

            background: #4169ff;
        }

        .orb.two {
            right: -120px;
            bottom: -140px;

            background: #00bfff;

            animation-delay: -6s;
        }

        @keyframes floatOrb {
            0%,
            100% {
                transform:
                    translate3d(0, 0, 0);
            }

            50% {
                transform:
                    translate3d(35px, -25px, 0);
            }
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .topbar {
            position: relative;
            z-index: 20;

            flex: 0 0 auto;

            height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0
                clamp(14px, 4vw, 40px);

            border-bottom:
                1px solid var(--border);

            background:
                rgba(5, 7, 13, .78);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .logo {
            position: relative;

            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            color: white;

            font-size: 19px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--purple)
                );

            box-shadow:
                0 0 32px
                rgba(91, 140, 255, .30);
        }

        .logo::after {
            content: "";

            position: absolute;
            inset: 2px;

            border:
                1px solid
                rgba(255,255,255,.22);

            border-radius: 12px;
        }

        .logo span {
            position: relative;
            z-index: 2;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            margin: 0;

            font-size:
                clamp(15px, 2vw, 19px);

            line-height: 1.2;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text p {
            margin:
                4px
                0
                0;

            color: var(--muted);

            font-size: 10px;

            white-space: nowrap;
        }

        .top-actions {
            display: flex;
            align-items: center;

            gap: 8px;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            color: #dce5f7;

            border:
                1px solid
                var(--border);

            border-radius: 13px;

            background:
                rgba(255,255,255,.035);

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .icon-button:hover {
            transform: translateY(-1px);

            border-color:
                var(--border-hover);

            background:
                rgba(91,140,255,.1);
        }

        /* =========================================================
           MAIN
        ========================================================= */

        main {
            position: relative;
            z-index: 5;

            flex: 1 1 auto;

            min-height: 0;

            display: flex;
            justify-content: center;
        }

        .chat-container {
            width:
                min(100%, 1000px);

            height: 100%;

            min-height: 0;

            display: flex;
            flex-direction: column;

            padding:
                18px
                clamp(10px, 3vw, 24px)
                10px;
        }

        /* =========================================================
           CHAT AREA
        ========================================================= */

        #chat {
            flex: 1 1 auto;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                6px
                2px
                18px;

            scroll-behavior: smooth;

            scrollbar-width: thin;

            scrollbar-color:
                rgba(255,255,255,.14)
                transparent;
        }

        #chat::-webkit-scrollbar {
            width: 5px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,.13);

            border-radius: 20px;
        }

        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 8px;
        }

        .welcome-card {
            width:
                min(100%, 720px);

            padding:
                clamp(25px, 6vw, 52px);

            text-align: center;

            border:
                1px solid
                var(--border);

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.015)
                );

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(20px);
        }

        .welcome-logo {
            width: 76px;
            height: 76px;

            margin:
                0
                auto
                20px;

            display: grid;
            place-items: center;

            border-radius: 25px;

            font-size: 30px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #3769ff,
                    #713cff
                );

            box-shadow:
                0 15px 50px
                rgba(83,91,255,.3);
        }

        .welcome-card h2 {
            margin:
                0
                0
                12px;

            font-size:
                clamp(26px, 6vw, 43px);

            line-height: 1.2;

            letter-spacing: -.8px;
        }

        .gradient-text {
            background:
                linear-gradient(
                    90deg,
                    #73a2ff,
                    #b48cff,
                    #53e8ff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .welcome-card > p {
            max-width: 570px;

            margin:
                0
                auto;

            color: var(--muted);

            line-height: 1.9;

            font-size: 14px;
        }

        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 10px;

            margin-top: 28px;
        }

        .suggestion {
            min-height: 54px;

            padding: 13px;

            color: #e1e8f7;

            text-align: right;

            border:
                1px solid
                var(--border);

            border-radius: 15px;

            background:
                rgba(255,255,255,.025);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .suggestion:hover {
            transform:
                translateY(-2px);

            border-color:
                var(--border-hover);

            background:
                rgba(91,140,255,.08);
        }

        /* =========================================================
           MESSAGES
        ========================================================= */

        .message {
            display: flex;

            gap: 10px;

            margin-bottom: 17px;

            animation:
                messageIn .25s ease both;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        @keyframes messageIn {
            from {
                opacity: 0;

                transform:
                    translateY(7px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .avatar {
            width: 35px;
            height: 35px;

            flex:
                0 0 35px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: white;

            font-size: 10px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #3769ff,
                    #713cff
                );
        }

        .message.ai .avatar {
            background:
                linear-gradient(
                    135deg,
                    #00a6c7,
                    #4d54ff
                );
        }

        .bubble {
            max-width:
                min(84%, 760px);

            padding:
                13px
                16px;

            color: #e8edf8;

            font-size: 14px;

            line-height: 1.85;

            overflow-wrap: anywhere;
            word-break: break-word;

            border-radius: 18px;

            background:
                var(--ai-gradient);

            border:
                1px solid
                var(--border);

            border-bottom-left-radius: 5px;
        }

        .message.user .bubble {
            color: white;

            background:
                var(--user-gradient);

            border: 0;

            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 5px;

            box-shadow:
                0 8px 30px
                rgba(48,64,190,.20);
        }

        .bubble pre {
            direction: ltr;

            max-width: 100%;

            margin:
                12px
                0
                0;

            padding: 14px;

            overflow-x: auto;

            text-align: left;

            border-radius: 12px;

            background:
                #04060a;

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .bubble code {
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 12px;
        }

        /* =========================================================
           THINKING
        ========================================================= */

        .thinking {
            display: flex;
            align-items: center;

            gap: 6px;

            min-height: 25px;
        }

        .thinking-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #6c9bff;

            animation:
                thinking 1.1s
                infinite
                ease-in-out;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: .15s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes thinking {
            0%,
            70%,
            100% {
                opacity: .3;
                transform: scale(.8);
            }

            35% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* =========================================================
           COMPOSER
        ========================================================= */

        .composer-wrapper {
            position: relative;
            z-index: 30;

            flex:
                0 0 auto;

            padding-top: 6px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 40%,
                    transparent
                );
        }

        .composer {
            width: 100%;

            display: flex;
            align-items: flex-end;

            gap: 8px;

            padding: 8px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 20px;

            background:
                rgba(11,15,25,.94);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.35);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);
        }

        #prompt {
            flex: 1 1 auto;

            min-width: 0;

            min-height: 45px;
            max-height: 160px;

            resize: none;

            outline: none;

            border: 0;

            background: transparent;

            color: var(--text);

            padding:
                11px
                10px;

            line-height: 1.65;

            scrollbar-width: thin;
        }

        #prompt::placeholder {
            color: #657087;
        }

        #prompt:disabled {
            opacity: .6;
        }

        .send-button {
            width: 45px;
            height: 45px;

            flex:
                0 0 45px;

            display: grid;
            place-items: center;

            color: white;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--purple)
                );

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(83,92,255,.25);

            transition:
                transform .2s ease,
                filter .2s ease,
                opacity .2s ease;
        }

        .send-button:hover {
            transform:
                translateY(-1px);

            filter:
                brightness(1.08);
        }

        .send-button:active {
            transform:
                scale(.96);
        }

        .send-button:disabled {
            opacity: .4;

            cursor:
                not-allowed;

            transform: none;
        }

        .composer-meta {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 10px;

            padding:
                7px
                5px
                2px;

            color: #626d82;

            font-size: 10px;
        }

        .status {
            display: flex;
            align-items: center;

            gap: 6px;

            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            flex:
                0 0 6px;

            border-radius: 50%;

            background:
                var(--success);

            box-shadow:
                0 0 10px
                var(--success);
        }

        .status.error .status-dot {
            background:
                var(--danger);

            box-shadow:
                0 0 10px
                var(--danger);
        }

        /* =========================================================
           TOAST
        =======================================
