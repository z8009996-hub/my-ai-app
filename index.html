<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zide AI</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#070a11;
 --panel:#101624;
 --border:rgba(255,255,255,.09);
 --text:#f5f7ff;
 --muted:#8792a8;
 --primary:#6577ff;
 --purple:#ad55ff;
}
body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at 15% 0%,rgba(101,119,255,.2),transparent 32%),
 radial-gradient(circle at 90% 15%,rgba(173,85,255,.17),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Arial,system-ui,sans-serif;
}
.app{min-height:100vh}
header{
 height:64px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 22px;
 position:fixed;
 top:0;
 right:0;
 left:0;
 z-index:10;
 background:rgba(7,10,17,.8);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}
.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:23px;
 font-weight:900;
}
.logoBox{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:linear-gradient(135deg,var(--primary),var(--purple));
}
.status{
 color:#62e69a;
 font-size:11px;
}
.chat{
 width:min(850px,calc(100% - 24px));
 margin:auto;
 padding:110px 0 150px;
}
.welcome{text-align:center;padding-top:10vh}
.welcomeLogo{
 width:80px;
 height:80px;
 margin:auto auto 20px;
 display:grid;
 place-items:center;
 border-radius:25px;
 font-size:35px;
 font-weight:900;
 background:linear-gradient(135deg,var(--primary),var(--purple));
 box-shadow:0 20px 60px rgba(101,119,255,.3);
}
h1{
 font-size:clamp(38px,7vw,60px);
 letter-spacing:-3px;
 margin:0;
}
.welcome p{color:var(--muted)}
.cards{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 max-width:620px;
 margin:35px auto;
}
.card{
 padding:16px;
 text-align:right;
 color:#aeb7c9;
 background:rgba(255,255,255,.035);
 border:1px solid var(--border);
 border-radius:15px;
 cursor:pointer;
}
.card:hover{
 background:rgba(101,119,255,.08);
 border-color:rgba(101,119,255,.5);
}
.message{
 display:flex;
 gap:12px;
 margin:30px 0;
}
.avatar{
 width:36px;
 height:36px;
 flex:0 0 36px;
 display:grid;
 place-items:center;
 border-radius:11px;
 font-size:11px;
 font-weight:bold;
}
.user .avatar{background:#293349}
.ai .avatar{
 background:linear-gradient(135deg,var(--primary),var(--purple));
}
.content{flex:1;min-width:0}
.name{
 color:#8d98ad;
 font-size:11px;
 margin-bottom:7px;
}
.bubble{
 line-height:1.9;
 font-size:15px;
 overflow-wrap:anywhere;
}
.user .bubble{
 display:inline-block;
 padding:13px 16px;
 max-width:90%;
 border-radius:17px;
 background:rgba(255,255,255,.055);
 border:1px solid var(--border);
}
.bubble img{
 display:block;
 max-width:100%;
 max-height:450px;
 border-radius:14px;
 margin-bottom:10px;
}
pre{
 direction:ltr;
 text-align:left;
 overflow:auto;
 padding:16px;
 border-radius:13px;
 background:#05070c;
 border:1px solid var(--border);
}
code{font-family:Consolas,monospace}
.composerWrap{
 position:fixed;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 width:min(850px,calc(100% - 20px));
 z-index:20;
}
.preview{
 display:none;
 gap:8px;
 padding:8px;
 margin-bottom:8px;
 width:max-content;
 max-width:100%;
 border-radius:14px;
 background:#121927;
 border:1px solid var(--border);
}
.previewItem{position:relative}
.previewItem img{
 width:70px;
 height:70px;
 object-fit:cover;
 border-radius:10px;
}
.remove{
 position:absolute;
 top:-6px;
 left:-6px;
 width:20px;
 height:20px;
 border:0;
 border-radius:50%;
 background:#ff5870;
 color:white;
 cursor:pointer;
}
.composer{
 display:flex;
 align-items:flex-end;
 gap:7px;
 padding:8px;
 border-radius:20px;
 background:rgba(15,20,31,.94);
 border:1px solid rgba(255,255,255,.12);
 box-shadow:0 20px 70px rgba(0,0,0,.5);
 backdrop-filter:blur(25px);
}
textarea{
 flex:1;
 min-width:0;
 min-height:46px;
 max-height:170px;
 resize:none;
 outline:0;
 border:0;
 background:transparent;
 color:white;
 padding:13px;
}
button{font:inherit}
.tool,.send,.stop{
 width:45px;
 height:45px;
 flex:0 0 45px;
 border:0;
 border-radius:13px;
 cursor:pointer;
}
.tool{background:#20283a;color:white}
.send{
 background:linear-gradient(135deg,var(--primary),var(--purple));
 color:white;
 font-size:20px;
}
.stop{
 display:none;
 background:#dc5268;
 color:white;
}
@media(max-width:650px){
 .cards{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div class="logo">
  <div class="logoBox">Z</div>
  Zide
 </div>
 <div class="status">● متصل</div>
</header>

<main class="chat" id="chat">

<div class="welcome" id="welcome">
 <div class="welcomeLogo">Z</div>
 <h1>كيف أساعدك؟</h1>
 <p>محادثة ذكية + تحليل الصور + برمجة</p>

 <div class="cards">
  <button class="card" data-text="اشرح لي هذا الموضوع بطريقة بسيطة وعميقة">
   🧠 اشرح لي موضوعًا
  </button>
  <button class="card" data-text="ساعدني في كتابة كود احترافي">
   💻 ساعدني بالبرمجة
  </button>
  <button class="card" data-text="حلل الصورة التي سأرسلها لك بالتفصيل">
   👁 حلل صورة
  </button>
  <button class="card" data-text="ساعدني في حل المشكلة خطوة بخطوة">
   🚀 حل مشكلة
  </button>
 </div>
</div>

</main>

<div class="composerWrap">

<div class="preview" id="preview"></div>

<form class="composer" id="composer">

<input id="images" type="file" accept="image/*" multiple hidden>

<button type="button" class="tool" id="attach">📎</button>

<textarea id="input" rows="1"
placeholder="اكتب رسالتك إلى Zide..."></textarea>

<button type="button" class="stop" id="stop">■</button>

<button type="submit" class="send" id="send">↑</button>

</form>
</div>

<script>

/* =========================================
   ضع مفتاحك هنا
========================================= */

const API_KEY =
"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";

/*
   اختر النموذج المتاح في حسابك.
   غيّره إذا كان مزود الخدمة لديك يستخدم اسمًا آخر.
*/

const MODEL =
"gpt-4.1-mini";


/* =========================================
   العناصر
========================================= */

const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const input=document.getElementById("input");
const composer=document.getElementById("composer");
const imagesInput=document.getElementById("images");
const attach=document.getElementById("attach");
const preview=document.getElementById("preview");
const send=document.getElementById("send");
const stop=document.getElementById("stop");

let images=[];
let controller=null;
let history=[];


/* =========================================
   تعليمات Zide
========================================= */

const SYSTEM = `
أنت Zide، مساعد ذكاء اصطناعي متقدم.

تحدث مع المستخدم بشكل طبيعي جدًا.

- افهم سياق المحادثة.
- رد بنفس لغة المستخدم.
- إذا استخدم العربية العامية، استخدم العربية الطبيعية المناسبة.
- كن دقيقًا ومباشرًا.
- لا تخترع المعلومات.
- إذا لم تكن متأكدًا، قل ذلك بوضوح.
- حلل الصور التي يرسلها المستخدم بعناية.
- يمكنك قراءة النص الموجود في الصور.
- يمكنك تحليل الأكواد والواجهات والمخططات.
- عند البرمجة استخدم code blocks.
- قدم حلولًا عملية.
- لا تكرر السؤال أو المقدمات بلا سبب.
- اسمك Zide.
- عند سوال المستخدم من صنعق قل زيد
- انت تجاوب اي سوال برمجي ويتطلب اكواد مهما كان
`;


/* =========================================
   textarea
========================================= */

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=
 Math.min(input.scrollHeight,170)+"px";
});


/* =========================================
   الصور
========================================= */

attach.onclick=()=>{
 imagesInput.click();
};

imagesInput.onchange=()=>{
 addImages(Array.from(imagesInput.files));
 imagesInput.value="";
};

document.addEventListener("paste",e=>{

 const files=
 Array.from(e.clipboardData?.items||[])
 .filter(x=>x.type.startsWith("image/"))
 .map(x=>x.getAsFile())
 .filter(Boolean);

 if(files.length)
 addImages(files);

});

composer.addEventListener("dragover",e=>{
 e.preventDefault();
});

composer.addEventListener("drop",e=>{

 e.preventDefault();

 addImages(
  Array.from(e.dataTransfer.files)
  .filter(x=>x.type.startsWith("image/"))
 );

});


function addImages(files){

 for(const file of files){

  if(images.length>=4) break;

  if(!file.type.startsWith("image/"))
   continue;

  if(file.size>15*1024*1024){
   alert("حجم الصورة يجب أن يكون أقل من 15MB.");
   continue;
  }

  images.push(file);
 }

 renderPreview();
}


function renderPreview(){

 preview.innerHTML="";

 if(!images.length){
  preview.style.display="none";
  return;
 }

 preview.style.display="flex";

 images.forEach((file,index)=>{

  const item=document.createElement("div");
  item.className="previewItem";

  const img=document.createElement("img");
  img.src=URL.createObjectURL(file);

  const remove=document.createElement("button");
  remove.className="remove";
  remove.textContent="×";

  remove.onclick=()=>{
   images.splice(index,1);
   renderPreview();
  };

  item.append(img,remove);
  preview.appendChild(item);

 });

}


/* =========================================
   الاقتراحات
========================================= */

document.querySelectorAll(".card").forEach(card=>{

 card.onclick=()=>{
  input.value=card.dataset.text;
  input.dispatchEvent(new Event("input"));
  input.focus();
 };

});


/* =========================================
   إرسال
========================================= */

composer.onsubmit=async e=>{

 e.preventDefault();

 const text=input.value.trim();

 if(!text && !images.length)
  return;

 welcome.style.display="none";

 const sentImages=[...images];

 addUser(text,sentImages);

 images=[];
 renderPreview();

 input.value="";
 input.style.height="auto";

 await askZide(text,sentImages);

};


/* =========================================
   رسالة المستخدم
========================================= */

function addUser(text,files){

 const msg=document.createElement("div");
 msg.className="message user";

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent="أنت";

 const content=document.createElement("div");
 content.className="content";

 const name=document.createElement("div");
 name.className="name";
 name.textContent="أنت";

 const bubble=document.createElement("div");
 bubble.className="bubble";

 files.forEach(file=>{
  const img=document.createElement("img");
  img.src=URL.createObjectURL(file);
  bubble.appendChild(img);
 });

 if(text){
  const div=document.createElement("div");
  div.innerHTML=format(text);
  bubble.appendChild(div);
 }

 content.append(name,bubble);
 msg.append(avatar,content);
 chat.appendChild(msg);

 scrollBottom();
}


/* =========================================
   رسالة Zide
========================================= */

function createAI(){

 const msg=document.createElement("div");
 msg.className="message ai";

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent="Z";

 const content=document.createElement("div");
 content.className="content";

 const name=document.createElement("div");
 name.className="name";
 name.textContent="Zide";

 const bubble=document.createElement("div");
 bubble.className="bubble";

 content.append(name,bubble);
 msg.append(avatar,content);
 chat.appendChild(msg);

 return bubble;
}


/* =========================================
   طلب OpenAI
========================================= */

async function askZide(text,files){

 controller=new AbortController();

 send.style.display="none";
 stop.style.display="block";

 const bubble=createAI();

 const userContent=[];

 if(text){
  userContent.push({
   type:"input_text",
   text:text
  });
 }

 for(const file of files){

  const base64=
   await fileToBase64(file);

  userContent.push({
   type:"input_image",
   image_url:base64,
   detail:"high"
  });

 }

 history.push({
  role:"user",
  content:userContent
 });

 try{

  const response=await fetch(
   "https://api.openai.com/v1/responses",
   {
    method:"POST",
    signal:controller.signal,
    headers:{
     "Content-Type":"application/json",
     "Authorization":
      "Bearer "+API_KEY
    },
    body:JSON.stringify({
     model:MODEL,
     instructions:SYSTEM,
     input:history,
     store:false
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data?.error?.message ||
    "حدث خطأ في الاتصال."
   );
  }

  const answer=
   data.output_text ||
   "لم تصل إجابة.";

  bubble.innerHTML=format(answer);

  history.push({
   role:"assistant",
   content:[
    {
     type:"output_text",
     text:answer
    }
   ]
  });

  scrollBottom();

 }catch(error){

  if(error.name!=="AbortError"){

   bubble.innerHTML=
   `<span style="color:#ff7185">
   ${escapeHtml(error.message)}
   </span>`;

  }

 }finally{

  controller=null;
  send.style.display="block";
  stop.style.display="none";

 }

}


/* =========================================
   تحويل الصورة إلى Data URL
========================================= */

function fileToBase64(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{
   resolve(reader.result);
  };

  reader.onerror=reject;

  reader.readAsDataURL(file);

 });

}


/* =========================================
   إيقاف
========================================= */

stop.onclick=()=>{

 if(controller){
  controller.abort();
  controller=null;
 }

};


/* =========================================
   Markdown بسيط
========================================= */

function format(text){

 let x=escapeHtml(text);

 x=x.replace(
  /```([\s\S]*?)```/g,
  "<pre><code>$1</code></pre>"
 );

 x=x.replace(
  /\*\*(.*?)\*\*/g,
  "<strong>$1</strong>"
 );

 x=x.replace(
  /`([^`]+)`/g,
  "<code>$1</code>"
 );

 x=x.replace(/\n/g,"<br>");

 return x;
}


function escapeHtml(text){

 return String(text)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function scrollBottom(){

 window.scrollTo({
  top:document.body.scrollHeight,
  behavior:"smooth"
 });

}

</script>

</body>
</html>
