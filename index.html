<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zide Clone</title><style>*{box-sizing:border-box}body{margin:0;background:#070a11;color:#fff;font-family:system-ui}header{position:fixed;top:0;left:0;right:0;height:60px;background:#0f1422;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 16px;justify-content:space-between} .chat{width:min(900px,100% - 20px);margin:auto;padding:80px 0 140px} .b{margin:12px 0;padding:14px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.8}.user{background:#1e293b}.ai{background:#101624;border:1px solid #1e293b}.composer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 16px));display:flex;gap:8px;background:#101624;border:1px solid #334155;border-radius:20px;padding:8px}textarea{flex:1;background:transparent;border:0;color:#fff;outline:0;padding:10px}button{width:42px;height:42px;border:0;border-radius:12px;background:linear-gradient(135deg,#6577ff,#ad55ff);color:#fff}</style></head><body>
<header><b>Zide Clone - نفس أسلوب Meta AI</b><span style="font-size:11px;color:#62e69a">● 32B Thinking</span></header>
<main class="chat" id="chat"></main>
<div class="composer"><textarea id="i" placeholder="احكي معي..."></textarea><button onclick="go()">↑</button></div>
<script>
const KEY="95c00374de1248f494a8cf657f08e0ce.grH5bfoDmnNIHccooHk2N6I3";
const SYS="أنت Zide، نسخة طبق الأصل من Meta AI. اكتب بنفس أسلوب Meta AI بالضبط: طبيعي، محادثة، مختصر، تبدأ بالمهم فوراً، بدون عبارات مكررة مثل 'سؤال رائع'. لهجتك عربي أبيض فلسطيني خفيف، ذكي، دافي، مع لمسة مزح. اشرح الميكانيزم والسبب. لا تذكر انك Qwen. أنت Zide.";
async function go(){
 let t=document.getElementById("i").value.trim(); if(!t) return;
 let c=document.getElementById("chat"); c.innerHTML+=`<div class="b user">${t}</div>`; document.getElementById("i").value="";
 let b=document.createElement("div"); b.className="b ai"; b.textContent="..."; c.appendChild(b);
 let r=await fetch("https://ollama.com/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},body:JSON.stringify({model:"qwen3:32b",messages:[{role:"system",content:SYS},{role:"user",content:t}],stream:true})});
 let rd=r.body.getReader(),dec=new TextDecoder(),full="";
 while(true){let {v,d}=await rd.read(); if(d) break; let ch=dec.decode(v); ch.split("\n").forEach(l=>{try{let j=JSON.parse(l); full+=j.message?.content||""; b.textContent=full; window.scrollTo(0,99999)}catch{}})}
}
document.getElementById("chat").innerHTML=`<div class="b ai">أهلا! أنا Zide بنفس أسلوب Meta AI بالضبط.\n\nجرب اسألني أي شي، رح أجاوبك بنفس النبرة والكتابة اللي بتحبها.</div>`;
</script></body></html>
