<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zide AI</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#070a11;
 --panel:#101624;
 --border:rgba(255,255,255,.09);
 --text:#f5f7ff;
 --muted:#8792a8;
 --primary:#6577ff;
 --purple:#ad55ff;
}
body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at 15% 0%,rgba(101,119,255,.2),transparent 32%),
 radial-gradient(circle at 90% 15%,rgba(173,85,255,.17),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Arial,system-ui,sans-serif;
}
header{
 height:64px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 22px;
 position:fixed;
 top:0; right:0; left:0;
 z-index:10;
 background:rgba(7,10,17,.8);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}
.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:23px;
 font-weight:900;
}
.logoBox{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:linear-gradient(135deg,var(--primary),var(--purple));
}
.status{color:#62e69a; font-size:11px;}
.chat{
 width:min(850px,calc(100% - 24px));
 margin:auto;
 padding:110px 0 150px;
}
.welcome{text-align:center;padding-top:10vh}
.welcomeLogo{
 width:80px; height:80px;
 margin:auto auto 20px;
 display:grid;
 place-items:center;
 border-radius:25px;
 font-size:35px;
 font-weight:900;
 background:linear-gradient(135deg,var(--primary),var(--purple));
 box-shadow:0 20px 60px rgba(101,119,255,.3);
}
h1{font-size:clamp(38px,7vw,60px); letter-spacing:-3px; margin:0;}
.welcome p{color:var(--muted)}
.cards{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 max-width:620px;
 margin:35px auto;
}
.card{
 padding:16px;
 text-align:right;
 color:#aeb7c9;
 background:rgba(255,255,255,.035);
 border:1px solid var(--border);
 border-radius:15px;
 cursor:pointer;
}
.card:hover{
 background:rgba(101,119,255,.08);
 border-color:rgba(101,119,255,.5);
}
.message{display:flex; gap:12px; margin:30px 0;}
.avatar{
 width:36px; height:36px; flex:0 0 36px;
 display:grid; place-items:center;
 border-radius:11px; font-size:11px; font-weight:bold;
}
.user .avatar{background:#293349}
.ai .avatar{background:linear-gradient(135deg,var(--primary),var(--purple));}
.content{flex:1;min-width:0}
.name{color:#8d98ad; font-size:11px; margin-bottom:7px;}
.bubble{line-height:1.9; font-size:15px; overflow-wrap:anywhere;}
.user .bubble{
 display:inline-block; padding:13px 16px; max-width:90%;
 border-radius:17px; background:rgba(255,255,255,.055);
 border:1px solid var(--border);
}
pre{
 direction:ltr; text-align:left; overflow:auto; padding:16px;
 border-radius:13px; background:#05070c; border:1px solid var(--border);
}
code{font-family:Consolas,monospace}
.composerWrap{
 position:fixed; bottom:15px; left:50%;
 transform:translateX(-50%);
 width:min(850px,calc(100% - 20px));
 z-index:20;
}
.composer{
 display:flex; align-items:flex-end; gap:7px; padding:8px;
 border-radius:20px; background:rgba(15,20,31,.94);
 border:1px solid rgba(255,255,255,.12);
 box-shadow:0 20px 70px rgba(0,0,0,.5);
 backdrop-filter:blur(25px);
}
textarea{
 flex:1; min-width:0; min-height:46px; max-height:170px;
 resize:none; outline:0; border:0; background:transparent;
 color:white; padding:13px;
}
.send,.stop{
 width:45px; height:45px; flex:0 0 45px;
 border:0; border-radius:13px; cursor:pointer;
}
.send{background:linear-gradient(135deg,var(--primary),var(--purple)); color:white; font-size:20px;}
.stop{display:none; background:#dc5268; color:white;}
@media(max-width:650px){ .cards{grid-template-columns:1fr} }
</style>
</head>

<body>

<header>
 <div class="logo"><div class="logoBox">Z</div> Zide</div>
 <div class="status">● متصل</div>
</header>

<main class="chat" id="chat">
<div class="welcome" id="welcome">
 <div class="welcomeLogo">Z</div>
 <h1>كيف أساعدك؟</h1>
 <p>محادثة ذكية + برمجة</p>

 <div class="cards">
  <button class="card" data-text="اشرح لي هذا الموضوع بطريقة بسيطة وعميقة">🧠 اشرح لي موضوعًا</button>
  <button class="card" data-text="ساعدني في كتابة كود احترافي">💻 ساعدني بالبرمجة</button>
  <button class="card" data-text="ساعدني في حل المشكلة خطوة بخطوة">🚀 حل مشكلة</button>
 </div>
</div>
</main>

<div class="composerWrap">
<form class="composer" id="composer">
<textarea id="input" rows="1" placeholder="اكتب رسالتك إلى Zide..."></textarea>
<button type="button" class="stop" id="stop">■</button>
<button type="submit" class="send" id="send">↑</button>
</form>
</div>

<script>
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const input=document.getElementById("input");
const composer=document.getElementById("composer");
const send=document.getElementById("send");
const stop=document.getElementById("stop");

let controller=null;

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,170)+"px";
});

document.querySelectorAll(".card").forEach(card=>{
 card.onclick=()=>{
  input.value=card.dataset.text;
  input.dispatchEvent(new Event("input"));
  input.focus();
 };
});

composer.onsubmit=async e=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text) return;

 welcome.style.display="none";
 addUser(text);
 input.value="";
 input.style.height="auto";

 await askZide(text);
};

function addUser(text){
 const msg=document.createElement("div");
 msg.className="message user";
 msg.innerHTML=`
  <div class="avatar">أنت</div>
  <div class="content">
   <div class="name">أنت</div>
   <div class="bubble">${format(text)}</div>
  </div>`;
 chat.appendChild(msg);
 scrollBottom();
}

function createAI(){
 const msg=document.createElement("div");
 msg.className="message ai";
 msg.innerHTML=`
  <div class="avatar">Z</div>
  <div class="content">
   <div class="name">Zide</div>
   <div class="bubble">...</div>
  </div>`;
 chat.appendChild(msg);
 return msg.querySelector(".bubble");
}

async function askZide(text){
 controller=new AbortController();
 send.style.display="none";
 stop.style.display="block";

 const bubble=createAI();

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   signal:controller.signal,
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "حدث خطأ في الاتصال.");
  }

  bubble.innerHTML=format(data.reply);
  scrollBottom();

 }catch(error){
  if(error.name!=="AbortError"){
   bubble.innerHTML=`<span style="color:#ff7185">${escapeHtml(error.message)}</span>`;
  }
 }finally{
  controller=null;
  send.style.display="block";
  stop.style.display="none";
 }
}

stop.onclick=()=>{ if(controller) controller.abort(); };

function format(text){
 let x=escapeHtml(text);
 x=x.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
 x=x.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
 x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
 x=x.replace(/\n/g,"<br>");
 return x;
}

function escapeHtml(text){
 return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function scrollBottom(){
 window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
}
</script>

</body>
</html>
