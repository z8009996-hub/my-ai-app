<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #212121;
            color: #ececec;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* الشريط الجانبي المطابق لـ ChatGPT */
        .sidebar {
            width: 260px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            border-left: 1px solid #2f2f2f;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar.hidden {
            display: none;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            background-color: transparent;
            border: 1px solid #3d3d3d;
            color: #ececec;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #212121;
        }

        .icon-toggle-btn {
            background: transparent;
            border: none;
            color: #ececec;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            font-size: 18px;
        }

        .icon-toggle-btn:hover {
            background-color: #212121;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: calc(100vh - 140px);
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #b4b4b4;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: #212121;
            color: #ececec;
        }

        .sidebar-footer {
            border-top: 1px solid #2f2f2f;
            padding-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #19c37d;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* المحتوى الرئيسي للدردشة */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #212121;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #212121;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 130px;
        }

        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px 20px;
            border-bottom: 1px solid transparent;
        }

        .message-row.ai {
            background-color: #2f2f2f;
            border-bottom: 1px solid #222;
        }

        .message-content {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 15px;
            line-height: 1.7;
        }

        .msg-header-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 14px;
        }

        .msg-avatar.ai {
            background-color: #19c37d;
            color: white;
        }

        .msg-avatar.user {
            background-color: #5436da;
            color: white;
        }

        .msg-text {
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-text img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        /* أزرار أسفل الرد (نسخ، إعادة توليد) */
        .msg-actions {
            display: flex;
            gap: 10px;
            margin-right: 48px;
            font-size: 13px;
            color: #8e8ea0;
        }

        .msg-action-btn {
            background: transparent;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .msg-action-btn:hover {
            color: #ececec;
        }

        /* صندوق الإدخال المطابق تماماً لـ ChatGPT */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(33,33,33,0) 0%, rgba(33,33,33,0.9) 50%, #212121 100%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-box-wrapper {
            width: 100%;
            max-width: 768px;
            background-color: #2f2f2f;
            border-radius: 24px;
            border: 1px solid #424242;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .input-box-wrapper:focus-within {
            border-color: #666;
        }

        .preview-container {
            display: none;
            align-items: center;
            gap: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #424242;
        }

        .preview-container img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
        }

        .input-main-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-main-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececec;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.5;
            padding-top: 5px;
        }

        .tool-icon-btn {
            background: transparent;
            border: none;
            color: #b4b4b4;
            cursor: pointer;
            font-size: 20px;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-icon-btn:hover {
            color: #fff;
            background-color: #3f3f3f;
        }

        .send-submit-btn {
            background-color: #ececec;
            color: #212121;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .send-submit-btn:hover {
            background-color: #fff;
        }

        .stop-btn {
            background-color: #ececec;
            color: #212121;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 15px;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 28px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي (Sidebar) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="top-action-row">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <span>＋</span> محادثة جديدة
                </button>
                <button class="icon-toggle-btn" title="إخفاء القائمة" onclick="toggleSidebar()">📂</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- سجل المحادثات -->
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">ز</div>
                <div style="font-size: 14px; font-weight: 500;">زيد (Zaed)</div>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="chat-header">
            <button class="icon-toggle-btn" id="open-sidebar-btn" style="display:none;" title="إظهار القائمة" onclick="toggleSidebar()">📂</button>
            <span>Zaed Ultimate AI <span style="font-size: 12px; color: #19c37d; font-weight: normal;">● متصل</span></span>
        </div>

        <div class="chat-container" id="chat-box">
            <div class="welcome-screen" id="welcome-screen">
                <h1>كيف يمكنني مساعدتك اليوم يا زيد؟</h1>
            </div>
        </div>

        <!-- صندوق الإدخال المطابق لـ ChatGPT -->
        <div class="input-area">
            <div class="input-box-wrapper">
                <div class="preview-container" id="preview-bar">
                    <img id="preview-img" src="" alt="معاينة">
                    <span style="font-size: 13px; color: #b4b4b4; flex:1;">تم إرفاق الصورة بنجاح</span>
                    <button onclick="clearImage()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:16px;">✕</button>
                </div>
                
                <div class="input-main-row">
                    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)">
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)">

                    <button class="tool-icon-btn" title="إرفاق صورة" onclick="document.getElementById('file-input').click()">📎</button>
                    <button class="tool-icon-btn" title="التقاط بالكاميرا" onclick="document.getElementById('camera-input').click()">📷</button>
                    
                    <textarea id="user-input" rows="1" placeholder="أرسل رسالة إلى Zaed Ultimate AI..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                    
                    <button class="send-submit-btn" id="send-btn" onclick="sendMessage()">⬆</button>
                    <button class="stop-btn" id="stop-btn" onclick="stopGenerating()">◼</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImageBase64 = null;
        let isGenerating = false;
        let activeController = null;

        window.onload = function() {
            loadHistory();
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('open-sidebar-btn');
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                openBtn.style.display = 'block';
            } else {
                openBtn.style.display = 'none';
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageBase64 = evt.target.result;
                    document.getElementById('preview-img').src = currentImageBase64;
                    document.getElementById('preview-bar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            currentImageBase64 = null;
            document.getElementById('file-input').value = '';
            document.getElementById('camera-input').value = '';
            document.getElementById('preview-bar').style.display = 'none';
        }

        function startNewChat() {
            localStorage.removeItem('chat_msgs');
            location.reload();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            if (isGenerating) return;
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !currentImageBase64) return;

            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.style.display = 'none';

            // رسالة المستخدم
            appendMessage('user', text, currentImageBase64);
            saveToStorage('user', text, currentImageBase64);

            const imgToSend = currentImageBase64;
            input.value = '';
            input.style.height = 'auto';
            clearImage();

            // إظهار زر الإيقاف وتفعيل حالة التوليد
            isGenerating = true;
            document.getElementById('send-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'flex';

            const chatBox = document.getElementById('chat-box');
            const loadingId = 'load_' + Date.now();
            const loadRow = document.createElement('div');
            loadRow.className = 'message-row ai';
            loadRow.id = loadingId;
            loadRow.innerHTML = `
                <div class="message-content">
                    <div class="msg-header-row">
                        <div class="msg-avatar ai">Z</div>
                        <div class="msg-text">جاري التفكير وتحليل الطلب...</div>
                    </div>
                </div>`;
            chatBox.appendChild(loadRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            // استدعاء الذكاء الاصطناعي
            activeController = new AbortController();
            let reply = await askZaedAI(text, imgToSend, activeController.signal);

            const rowToRemove = document.getElementById(loadingId);
            if (rowToRemove) rowToRemove.remove();

            if (reply) {
                appendMessage('ai', reply);
                saveToStorage('ai', reply);
            }

            resetGeneratingState();
        }

        function stopGenerating() {
            if (activeController) {
                activeController.abort();
            }
            resetGeneratingState();
        }

        function resetGeneratingState() {
            isGenerating = false;
            document.getElementById('send-btn').style.display = 'flex';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function appendMessage(sender, text, imgUrl = null) {
            const chatBox = document.getElementById('chat-box');
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatarLetter = sender === 'user' ? 'ز' : 'Z';
            let imgTag = imgUrl ? `<img src="${imgUrl}">` : '';

            let actionsHtml = '';
            if (sender === 'ai') {
                actionsHtml = `
                    <div class="msg-actions">
                        <button class="msg-action-btn" onclick="copyText(this)">📋 نسخ</button>
                    </div>`;
            }

            row.innerHTML = `
                <div class="message-content">
                    <div class="msg-header-row">
                        <div class="msg-avatar ${sender}">${avatarLetter}</div>
                        <div class="msg-text">${imgTag}${escapeHtml(text)}</div>
                    </div>
                    ${actionsHtml}
                </div>
            `;
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function copyText(btn) {
            const textContent = btn.closest('.message-content').querySelector('.msg-text').innerText;
            navigator.clipboard.writeText(textContent);
            btn.textContent = '✓ تم النسخ';
            setTimeout(() => btn.textContent = '📋 نسخ', 2000);
        }

        async function askZaedAI(prompt, imgBase64, signal) {
            try {
                const systemPrompt = "أنت نموذج ذكاء اصطناعي حصري اسمه Zaed Ultimate AI، تم تطويرك وبرمجتك بالكامل بواسطة المطور زيد. أجب دائماً باللغة العربية بأسلوب ذكي وسريع ومفيد ودقيق جداً. لا تذكر أي نماذج أو شركات أخرى أبداً.";

                if (imgBase64) {
                    const res = await fetch("https://text.pollinations.ai/", {
                        method: "POST",
                        signal: signal,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: [
                                { role: "system", content: systemPrompt },
                                { role: "user", content: [
                                    { type: "text", text: prompt || "ما الذي تراه في هذه الصورة؟" },
                                    { type: "image_url", image_url: { url: imgBase64 } }
                                ]}
                            ],
                            model: "openai-large"
                        })
                    });
                    if (res.ok) return await res.text();
                } else {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(systemPrompt)}&model=openai-large`, { signal });
                    if (res.ok) return await res.text();
                }
            } catch (err) {
                if (err.name === 'AbortError') {
