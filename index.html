<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        /* الهيدر العلوي */
        .header {
            background-color: #141923;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222938;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background-color: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .status-info h2 {
            font-size: 16px;
            color: #fff;
        }

        .status-info p {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* منطقة المحادثة */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* رسائل الذكاء الاصطناعي */
        .message.ai {
            background-color: #1a202c;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid #2d3748;
        }

        /* رسائل المستخدم */
        .message.user {
            background-color: #6366f1;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        /* رسالة الانتظار */
        .message.loading {
            background-color: #1a202c;
            color: #a0aec0;
            align-self: flex-start;
            font-style: italic;
        }

        /* منطقة الإدخال بالأسفل */
        .input-container {
            padding: 15px 20px;
            background-color: #141923;
            display: flex;
            gap: 10px;
            border-top: 1px solid #222938;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background-color: #0b0e14;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-container input:focus {
            border-color: #6366f1;
        }

        .input-container button {
            padding: 12px 24px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="header">
        <div class="avatar">Z</div>
        <div class="status-info">
            <h2>Zaed Ultimate AI</h2>
            <p><span class="status-dot"></span> الذكاء الاصطناعي متصل</p>
        </div>
    </div>

    <!-- حاوية الرسائل -->
    <div class="chat-container" id="chat-box">
        <div class="message ai">أنا بخير وعال العال، وجاهز تماماً لمساعدتك! كيف حالك اليوم؟ 🌟</div>
    </div>

    <!-- حقل الكتابة والزر -->
    <div class="input-container">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <!-- كود الجافاسكربت المحسّن -->
    <script>
        // دالة جلب الرد من سيرفر الذكاء الاصطناعي المجاني (Pollinations)
        async function getAIResponse(userQuery) {
            try {
                const systemPrompt = "أنت ذكاء اصطناعي ذكي وسريع اسمه Zaed Ultimate AI، طورك وبرمجك المطور زيد. أجب دائماً باللغة العربية بأسلوب ذكي، مفيد ومختصر.";
                const apiUrl = `https://text.pollinations.ai/${encodeURIComponent(userQuery)}?system=${encodeURIComponent(systemPrompt)}`;
                
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const aiText = await response.text();
                    if (aiText && aiText.trim().length > 0) {
                        return aiText.trim();
                    }
                }
            } catch (e) {
                console.error("AI Fetch Error:", e);
            }

            // محرك ردود احتياطي بالعامية والفصحى
            const query = userQuery.trim().toLowerCase();

            if (query.includes("شو اسمك") || query.includes("اسمك") || query.includes("مين انت") || query.includes("انتا مين") || query.includes("من انت") || query.includes("ما اسمك")) {
                return "أنا Zaed Ultimate AI، نموذج ذكاء اصطناعي تم تطويري بواسطة المطور زيد لخدمتك وإجابة أسئلتك! 🚀";
            }
            if (query.includes("مرحبا") || query.includes("هلا") || query.includes("أهلا") || query.includes("السلام عليكم") || query.includes("الو")) {
                return "أهلاً وسهلاً بك! كيف يمكنني مساعدتك اليوم؟ 😊";
            }
            if (query.includes("كيف حالك") || query.includes("كيفك") || query.includes("اخبارك") || query.includes("شلونك")) {
                return "أنا بخير وعال العال وجاهز لمساعدتك! أنت كيف حالك؟ 🌟";
            }
            if (query.includes("رد") || query.includes("تكلم") || query.includes("اسمع")) {
                return "أنا معك وبسمعك! تفضل، شو السؤال أو الموضوع اللي حابب نتناقش فيه؟";
            }

            return "أنا هنا لمساعدتك! يمكنك أن تسألني عن أي موضوع وسأجيبك فوراً.";
        }

        // دالة إرسال الرسالة وعرضها في الشاشة
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text) return;

            // 1. إظهار رسالة المستخدم
            const userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. إظهار مؤشر "جاري التفكير..."
            const loadingMsg = document.createElement("div");
            loadingMsg.className = "message loading";
            loadingMsg.textContent = "جاري التفكير والتحليل...";
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. جلب الرد واستبدال مؤشر التحميل
            const replyText = await getAIResponse(text);
            chatBox.removeChild(loadingMsg);

            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            aiMsg.textContent = replyText;
            chatBox.appendChild(aiMsg);

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
