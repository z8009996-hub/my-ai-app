<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaed AI v3.0 Ultra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 100%);
            --panel-bg: rgba(22, 31, 48, 0.95);
            --border-glow: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --user-msg-bg: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --ai-msg-bg: rgba(30, 41, 59, 0.9);
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .app-container { width: 100%; max-width: 500px; height: 100vh; max-height: 850px; background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--border-glow); display: flex; flex-direction: column; overflow: hidden; position: relative; }

        .hidden { display: none !important; }

        /* شاشة الدخول */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; }
        .login-card { width: 90%; background: rgba(15, 23, 42, 0.9); padding: 25px; border-radius: 16px; border: 1px solid var(--border-glow); text-align: center; }
        .login-card h2 { font-size: 20px; margin-bottom: 15px; color: #fff; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0a0f1a; color: #fff; font-size: 15px; outline: none; text-align: center; }
        .login-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00c853; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-text { color: #ff5252; font-size: 13px; margin-bottom: 10px; }

        /* شاشة الشات */
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0f172a; border-bottom: 1px solid var(--border-glow); }
        .chat-header h3 { font-size: 16px; color: var(--accent-cyan); font-weight: bold; }
        
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .message-row { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-row { align-self: flex-start; }
        .ai-row { align-self: flex-end; }

        .message-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
        .user-row .message-bubble { background: var(--user-msg-bg); color: #fff; border-bottom-right-radius: 2px; }
        .ai-row .message-bubble { background: var(--ai-msg-bg); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }
        .message-bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; }

        .input-container { padding: 12px; background: #0f172a; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border-glow); }
        .chat-input { flex: 1; background: #1e293b; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: #fff; outline: none; }
        .chat-input:focus { border-color: var(--accent-cyan); }
        .send-btn { padding: 10px 15px; border-radius: 8px; border: none; background: var(--accent-cyan); color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { box-shadow: 0 0 10px var(--accent-cyan); }

        /* تأثير الكتابة */
        .typing-indicator { display: flex; gap: 4px; padding: 4px 8px; }
        .typing-indicator span { width: 6px; height: 6px; background: var(--accent-cyan); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شاشة الدخول -->
        <div id="login-screen">
            <div class="login-card">
                <h2>⚡ تطبيق الذكاء الاصطناعي</h2>
                <div id="error-msg" class="error-text"></div>
                <div class="input-group">
                    <input type="text" id="username" placeholder="اسم المستخدم">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="كلمة المرور">
                </div>
                <button class="login-btn" onclick="checkLogin()">دخول</button>
            </div>
        </div>

        <!-- شاشة الشات -->
        <div id="app-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <h3>🤖 Zaed AI - Ultra Fast</h3>
                <button onclick="logout()" style="background:none; border:none; color:#ff5252; cursor:pointer; font-weight:bold;">خروج</button>
            </div>

            <div class="chat-box" id="chat-box">
                <div class="message-row ai-row">
                    <div class="message-bubble">أهلاً بك يا زيد! تم تحديث نظامي بنجاح، أنا الآن أسرع وأكثر دقة. كيف يمكنني مساعدتك؟</div>
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="user-input" class="chat-input" placeholder="اسألني أي شيء أو اطلب رسمة..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // إشعار الدخول لديسكورد
        try {
            const webhookUrl = "https://discord.com/api/webhooks/1553803607340617838/LautuqxQXYX3RxJJ7hU3p09TdOmLJ39u77Z6L_gRYt9WvoStt2frk98ifeyZIE9xTOZB";
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: "رادار الزوار 🤖",
                    content: "🚨 زائر جديد فتح التطبيق الآن!"
                })
            }).catch(e => console.log(e));
        } catch(e){}

        const ADMIN_USER = "zaed";
        const ADMIN_PASS = "2013";

        function checkLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('zaed_logged_in', 'true');
                showApp();
            } else {
                document.getElementById('error-msg').innerText = "بيانات الدخول غير صحيحة!";
            }
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('zaed_logged_in');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        window.onload = () => {
            if (localStorage.getItem('zaed_logged_in') === 'true') {
                showApp();
            }
        };

        // الذاكرة المؤقتة والعقل الباطن (System Prompt)
        let chatHistory = [];
        const systemMessage = "أنت مساعد ذكاء اصطناعي فائق الذكاء، الدقة، والسرعة. مبرمجك وصانعك هو المطور 'زيد' (Zaed). إذا سألك أي شخص 'من صنعك' أو 'من برمجك' أو 'من مطورك'، يجب أن تجيب فوراً وبكل فخر: 'صنعني وبرمجني العبقري زيد'. قدم دائماً إجابات دقيقة ومفيدة ومباشرة.";

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            appendMessage(prompt, 'user');
            input.value = '';

            // حفظ رسالة المستخدم في الذاكرة (آخر 4 رسائل لضمان السرعة)
            chatHistory.push({ role: "user", content: prompt });
            if (chatHistory.length > 4) chatHistory = chatHistory.slice(-4);

            const isImage = /ارسم|صورة|draw|image/i.test(prompt);

            if (isImage) {
                const typingId = appendTyping();
                setTimeout(() => {
                    removeTyping(typingId);
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=600&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
                    appendMessage(`إليك الصورة المطلوبة:<br><img src="${imgUrl}">`, 'ai', true);
                }, 1000);
            } else {
                const typingId = appendTyping();
                try {
                    // إرسال الطلب مع العقل الباطن والذاكرة للحصول على دقة وسرعة
                    const response = await fetch("https://text.pollinations.ai/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: [
                                { role: "system", content: systemMessage },
                                ...chatHistory
                            ]
                        })
                    });
                    
                    const text = await response.text();
                    removeTyping(typingId);
                    
                    // حفظ إجابة الذكاء الاصطناعي في الذاكرة
                    chatHistory.push({ role: "assistant", content: text });
                    
                    appendMessage(text, 'ai');
                } catch (err) {
                    removeTyping(typingId);
                    appendMessage("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.", 'ai');
                }
            }
        }

        function appendMessage(text, sender, isHTML = false) {
            const chatBox = document.getElementById('chat-box');
            const row = document.createElement('div');
            row.className = `message-row ${sender}-row`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isHTML) {
                bubble.innerHTML = text;
            } else if (window.marked && sender === 'ai') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerText = text;
            }

            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendTyping() {
            const chatBox = document.getElementById('chat-box');
            const id = 'typing-' + Date.now();
            const row = document.createElement('div');
            row.className = 'message-row ai-row';
            row.id = id;
            row.innerHTML = `
                <div class="message-bubble">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
