<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaed Ultimate AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #212121;
            color: #ffffff;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* رأس الصفحة */
        .header {
            padding: 15px;
            background-color: #171717;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        /* منطقة عرض المحادثة */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-msg {
            text-align: center;
            margin: auto;
            font-size: 20px;
            color: #888;
        }

        .msg {
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg.user {
            background-color: #2f2f2f;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .msg.ai {
            background-color: #1e3a8a;
            align-self: flex-end;
        }

        .msg img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        /* شريط الإدخال السفلي الثابت والمبسط */
        .footer-input {
            background-color: #171717;
            padding: 10px 15px 20px 15px;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preview-box {
            display: none;
            align-items: center;
            gap: 10px;
            background: #2a2a2a;
            padding: 5px 10px;
            border-radius: 6px;
        }

        .preview-box img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #2f2f2f;
            border-radius: 25px;
            padding: 5px 10px 5px 15px;
            border: 1px solid #555;
        }

        .input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 100px;
            padding: 8px 0;
        }

        /* زر الإرسال الواضح والبارز */
        .send-btn {
            background-color: #10a37f;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .action-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">Zaed Ultimate AI</div>

        <div class="chat-area" id="chat-area">
            <div class="welcome-msg" id="welcome">كيف يمكنني مساعدتك اليوم يا زيد؟</div>
        </div>

        <div class="footer-input">
            <div class="preview-box" id="preview-box">
                <img id="preview-img" src="" alt="صورة مرفقة">
                <span style="font-size: 13px; flex: 1;">تم إرفاق الصورة بنجاح</span>
                <button onclick="removeImage()" style="background:none; border:none; color:#ff4444; font-size:16px; cursor:pointer;">✕</button>
            </div>

            <div class="input-row">
                <!-- أزرار المرفقات -->
                <button class="action-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <button class="action-btn" onclick="document.getElementById('camera-input').click()">📷</button>

                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadImage(event)">
                <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="loadImage(event)">

                <textarea id="user-input" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>

                <!-- زر الإرسال -->
                <button class="send-btn" id="send-btn" onclick="sendMsg()">⬆</button>
            </div>
        </div>
    </div>

    <script>
        let base64Image = null;

        function loadImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    base64Image = evt.target.result;
                    document.getElementById('preview-img').src = base64Image;
                    document.getElementById('preview-box').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            base64Image = null;
            document.getElementById('file-input').value = '';
            document.getElementById('camera-input').value = '';
            document.getElementById('preview-box').style.display = 'none';
        }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !base64Image) return;

            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';

            const chatArea = document.getElementById('chat-area');

            // إضافة رسالة المستخدم
            let imgTag = base64Image ? `<img src="${base64Image}">` : '';
            chatArea.innerHTML += `<div class="msg user">${imgTag}${escapeHtml(text)}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;

            const currentText = text;
            const currentImg = base64Image;

            // تصفير الحقول
            input.value = '';
            removeImage();

            // رسالة الانتظار
            const loadId = 'load_' + Date.now();
            chatArea.innerHTML += `<div class="msg ai" id="${loadId}">جاري التفكير...</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;

            // جلب الرد من الذكاء الاصطناعي
            let aiReply = await getAIResponse(currentText, currentImg);

            document.getElementById(loadId).remove();

            // إضافة رد الذكاء الاصطناعي
            chatArea.innerHTML += `<div class="msg ai">${escapeHtml(aiReply)}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function getAIResponse(prompt, img) {
            try {
                const sys = "أنت نموذج ذكاء اصطناعي اسمك Zaed Ultimate AI، طوّرك زيد. أجب دائماً بالعربية بدقة.";
                if (img) {
                    const res = await fetch("https://text.pollinations.ai/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: [
                                { role: "system", content: sys },
                                { role: "user", content: [
                                    { type: "text", text: prompt || "ما هذا؟" },
                                    { type: "image_url", image_url: { url: img } }
                                ]}
                            ],
                            model: "openai-large"
                        })
                    });
                    if (res.ok) return await res.text();
                } else {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(sys)}&model=openai-large`);
                    if (res.ok) return await res.text();
                }
            } catch (e) {
                console.error(e);
            }
            return "عذراً يا زيد، حدث خطأ في الاتصال بالخادم.";
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
